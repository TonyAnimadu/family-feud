<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1838">
<title>Family Feud</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:ital,wght@0,500;0,600;0,700;0,800;0,900;1,900&display=swap" rel="stylesheet">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="questions.js?v=9"></script>
<style>
/* ---------- palette: navy base, royal blue tiles, warm gold accent (complement), team blue vs coral ---------- */
:root{
  --bg0:#06102a; --bg1:#0b1d4a; --bg2:#123072;
  --tile1:#3a78ee; --tile2:#1f4fc4; --tile3:#173d9c;
  --navy:#0a1838; --panel:#0e2152; --panel2:#132a63; --line:rgba(160,190,255,.18);
  --gold:#f2b544; --gold-hi:#ffd889; --gold-lo:#a8740f;
  --t1:#3b82f6; --t1d:#1d4ed8; --t2:#f0644f; --t2d:#c2412f;
  --ink:#f5f7ff; --muted:#a9b7da; --ok:#2fbf71; --bad:#e5484d;
  --ff:"Franklin Gothic Medium","Franklin Gothic","ITC Franklin Gothic","Libre Franklin",Arial,sans-serif;
  --ffh:"Franklin Gothic Demi","Franklin Gothic Medium","ITC Franklin Gothic","Libre Franklin","Arial Black",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--ff);font-weight:500;color:var(--ink);background:var(--bg0);overflow-x:hidden;-webkit-font-smoothing:antialiased}
button,input,select{font-family:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.num{font-variant-numeric:tabular-nums}

/* ---------- stage ---------- */
.stage{position:fixed;inset:0;overflow:hidden;background:radial-gradient(ellipse 80% 70% at 50% 45%,var(--bg2) 0%,var(--bg1) 45%,var(--bg0) 100%)}
.rays{position:absolute;left:50%;top:var(--rayY,45%);width:260vmax;height:260vmax;transform:translate(-50%,-50%);background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.045) 0deg 7deg,rgba(255,255,255,0) 7deg 18deg);animation:spin 160s linear infinite;pointer-events:none}
.stage::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.45) 100%);pointer-events:none}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}

/* ---------- logo ---------- */
.logo{position:relative;display:flex;align-items:center;justify-content:center;width:var(--lw,46vmin);aspect-ratio:1.75/1;border-radius:50%;
  background:radial-gradient(ellipse at 50% 30%,#4a8cf5,#1c4fc2 58%,#0d2a78);
  box-shadow:0 0 0 calc(var(--lw,46vmin)*.022) var(--gold),0 0 0 calc(var(--lw,46vmin)*.034) var(--gold-lo),0 0 calc(var(--lw,46vmin)*.12) rgba(242,181,68,.35),inset 0 calc(var(--lw,46vmin)*-.03) calc(var(--lw,46vmin)*.08) rgba(0,0,0,.35)}
.logo .lt{font-family:var(--ffh);font-weight:900;font-style:italic;text-align:center;line-height:.92;font-size:calc(var(--lw,46vmin)*.2);letter-spacing:.01em;
  background:linear-gradient(#fff6d6 0%,#ffd66b 48%,#f2a51c 52%,#c47a07 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 calc(var(--lw,46vmin)*.012) 0 #5a3204);padding:0 .08em}

/* ---------- landing ---------- */
#landing{position:relative;z-index:2;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:32px 20px;text-align:center}
.card{background:rgba(10,24,56,.9);border:1px solid var(--line);border-radius:20px;padding:22px;width:100%;max-width:420px;box-shadow:0 18px 50px rgba(0,0,0,.45)}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:54px;border:none;border-radius:14px;font-size:18px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;transition:transform .08s,filter .15s}
.btn:active{transform:translateY(2px)}
.btn.gold{color:#2a1a00;background:linear-gradient(var(--gold-hi),var(--gold));box-shadow:0 4px 0 var(--gold-lo)}
.btn.blue{color:#fff;background:linear-gradient(#4a8cf5,var(--t1d));box-shadow:0 4px 0 #142f86}
.field{width:100%;min-height:54px;padding:0 16px;border-radius:14px;border:1.5px solid rgba(160,190,255,.35);background:#081533;color:var(--ink);font-size:20px;text-align:center;outline:none}
.field:focus{border-color:var(--gold)}
.muted{color:var(--muted);font-size:14px}
.stack{display:flex;flex-direction:column;gap:12px}

/* ---------- TV display ---------- */
#display{position:fixed;inset:0;z-index:2;display:flex;align-items:center;justify-content:center}
.titleScreen{display:flex;align-items:center;justify-content:center;width:100%;height:100vh}
.titleJoin{position:fixed;right:3vmin;bottom:3vmin;z-index:5;display:flex;align-items:center;gap:2vmin;background:rgba(8,20,50,.88);border:.25vmin solid rgba(242,181,68,.7);border-radius:2vmin;padding:1.6vmin 2.2vmin;box-shadow:0 1.5vmin 4vmin rgba(0,0,0,.4)}
.titleJoin .qr{background:#fff;padding:.8vmin;border-radius:1vmin;width:12.5vmin;height:12.5vmin}
.titleJoin .qr svg{width:100%;height:100%;display:block}
.titleJoin .lbl{font-size:1.7vmin;color:#cdd9f7;text-transform:uppercase;letter-spacing:.3vmin;font-weight:600}
.titleJoin .code{font-family:var(--ffh);font-weight:800;font-size:5.5vmin;letter-spacing:.8vmin;color:var(--gold-hi);line-height:1.05;margin-top:.6vmin}
.joinBox{display:flex;align-items:center;gap:4vmin;background:rgba(8,20,50,.88);border:.35vmin solid rgba(242,181,68,.7);border-radius:3vmin;padding:3vmin 4.5vmin;box-shadow:0 2vmin 6vmin rgba(0,0,0,.4)}
.joinBox .qr{background:#fff;padding:1.4vmin;border-radius:1.6vmin;width:25vmin;height:25vmin}
.joinBox .qr svg,.cornerQR .qr svg{width:100%;height:100%;display:block}
.joinBox .lbl{font-size:3.2vmin;color:#cdd9f7;text-transform:uppercase;letter-spacing:.35vmin;font-weight:600}
.joinBox .code{font-family:var(--ffh);font-weight:800;font-size:11vmin;letter-spacing:1.6vmin;color:var(--gold-hi);line-height:1.05;margin-top:1vmin}

.boardWrap{width:min(94vw,168vh);display:flex;flex-direction:column;align-items:center;gap:2vh;padding-top:11vh}
.question{font-weight:700;font-size:min(3.3vw,4.4vh);text-align:center;text-transform:uppercase;line-height:1.18;letter-spacing:.02em;padding:0 4vw;max-width:92vw;text-shadow:0 .3vh .8vh rgba(0,0,0,.6)}
.boardRow{display:grid;grid-template-columns:1fr minmax(0,62vw) 1fr;align-items:center;gap:2vw;width:100%}
.teamBox{display:flex;flex-direction:column;align-items:center;gap:1vh}
.teamName{font-family:var(--ffh);font-weight:800;font-size:min(2.1vw,3vh);text-transform:uppercase;letter-spacing:.12em;padding:.8vh 1.6vw;border-radius:1vh;background:var(--t1);color:#fff;max-width:15vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 .5vh 1.5vh rgba(0,0,0,.35)}
.teamName.t2{background:var(--t2)}
.scoreBox,.bankBox{font-family:var(--ffh);font-weight:800;font-variant-numeric:tabular-nums;line-height:1;text-align:center;border-radius:1.6vh;color:#fff;background:linear-gradient(#10275e,#081536);
  border:.45vh solid var(--gold);box-shadow:0 0 0 .3vh rgba(168,116,15,.8),0 1vh 3vh rgba(0,0,0,.45),inset 0 0 2vh rgba(0,0,0,.6)}
.scoreBox{font-size:min(6vw,8.5vh);padding:1.4vh 1.6vw;min-width:11vw}
.bankBox{font-size:min(4.6vw,6.6vh);padding:1vh 1.6vw;min-width:9vw}
.teamBox.active .scoreBox{box-shadow:0 0 0 .3vh rgba(168,116,15,.8),0 0 4vh rgba(255,216,137,.65),inset 0 0 2vh rgba(0,0,0,.6)}
.centerCol{display:flex;flex-direction:column;align-items:center;gap:1.8vh;min-width:0}
.multTag{font-family:var(--ffh);font-weight:800;color:var(--gold-hi);font-size:min(2vw,2.8vh);letter-spacing:.2em;min-height:1em}
.boardStage{position:relative;width:100%}
.board{width:100%;padding:3vh 2.2vw;border-radius:2.6vh;background:linear-gradient(#0b1f4f,#071434);
  border:.7vh solid var(--gold);box-shadow:0 0 0 .45vh var(--gold-lo),0 0 0 .9vh rgba(255,216,137,.35),0 2vh 6vh rgba(0,0,0,.6),inset 0 0 3vh rgba(0,0,0,.7);
  display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(4,auto);grid-auto-flow:column;gap:1.9vh 1.8vw}
.slot{height:min(9.4vh,6.6vw);perspective:120vh}
.slot .inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.34,1.4,.5,1)}
.slot.flip .inner{transform:rotateX(-180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:1.2vh;display:flex;align-items:center;justify-content:center;overflow:hidden;
  border:.25vh solid rgba(190,215,255,.55);box-shadow:inset 0 .6vh 1.2vh rgba(255,255,255,.22),inset 0 -.8vh 1.2vh rgba(0,0,0,.25)}
.front{background:linear-gradient(var(--tile1),var(--tile2) 55%,var(--tile3))}
.front .n{font-family:var(--ffh);font-weight:800;font-size:min(4.6vh,3.1vw);width:min(10vh,6.8vw);height:min(6.2vh,4.2vw);display:flex;align-items:center;justify-content:center;border-radius:50%;
  background:radial-gradient(ellipse at 50% 30%,#1f4fc4,#0b2266);border:.3vh solid var(--gold);text-shadow:0 .2vh 0 rgba(0,0,0,.5)}
.slot.empty .front{background:linear-gradient(#0f2862,#0a1c4a);border-color:rgba(120,150,220,.25);box-shadow:inset 0 0 1.5vh rgba(0,0,0,.4)}
.slot.empty .front .n{display:none}
.back{transform:rotateX(180deg);background:linear-gradient(#4a87f2,#2558cf 55%,#1c47b0);justify-content:space-between;align-items:stretch}
.back .ans{flex:1;display:flex;align-items:center;font-weight:700;text-transform:uppercase;font-size:min(3.1vh,2.1vw);line-height:1.15;letter-spacing:.02em;padding:1.2vh 1.4vw;text-align:left;text-shadow:0 .2vh .4vh rgba(0,0,0,.45);overflow:hidden}
.back .ans span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.back .pts{font-family:var(--ffh);font-weight:800;font-variant-numeric:tabular-nums;font-size:min(4.6vh,3.1vw);width:min(9.5vh,6.4vw);display:flex;align-items:center;justify-content:center;background:linear-gradient(#143379,#0b1f52);border-left:.25vh solid rgba(190,215,255,.45)}
.slot.unscored .back{filter:saturate(.45) brightness(.8)}

.strikes{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:2.4vw;z-index:20;pointer-events:none}
.xmark{width:min(33vh,22.5vw);height:min(33vh,22.5vw);animation:xin .28s cubic-bezier(.2,1.6,.4,1)}
.xmark svg{width:100%;height:100%;display:block;filter:drop-shadow(0 0 3vh rgba(229,72,77,.55)) drop-shadow(0 1.2vh 2.4vh rgba(0,0,0,.45))}
@keyframes xin{from{transform:scale(1.8);opacity:0}to{transform:scale(1);opacity:1}}

.buzzBanner{position:fixed;left:50%;top:2.6vh;transform:translateX(-50%);z-index:15;font-family:var(--ffh);font-weight:800;font-size:min(2.8vw,4.2vh);text-transform:uppercase;letter-spacing:.1em;padding:1.3vh 3vw;border-radius:2vh;color:#fff;
  background:var(--t1);border:.35vh solid rgba(255,255,255,.85);box-shadow:0 1.5vh 5vh rgba(0,0,0,.5),0 0 4vh rgba(59,130,246,.6);animation:bin .3s cubic-bezier(.2,1.5,.4,1);white-space:nowrap}
.buzzBanner.t2{background:var(--t2);box-shadow:0 1.5vh 5vh rgba(0,0,0,.5),0 0 4vh rgba(240,100,79,.6)}
@keyframes bin{from{transform:translate(-50%,-30%) scale(.8);opacity:0}to{transform:translate(-50%,0) scale(1);opacity:1}}
.cornerQR{position:fixed;right:2vmin;bottom:2vmin;z-index:5;background:rgba(8,20,50,.88);border:1px solid rgba(242,181,68,.6);border-radius:1.6vmin;padding:1.1vmin 1.4vmin;display:flex;align-items:center;gap:1.2vmin}
.cornerQR .qr{background:#fff;width:10vmin;height:10vmin;padding:.6vmin;border-radius:.8vmin}
.cornerQR .c{font-family:var(--ffh);font-weight:800;font-size:3.4vmin;color:var(--gold-hi);letter-spacing:.5vmin;line-height:1}
.cornerQR .s{font-size:1.7vmin;color:#cdd9f7;text-transform:uppercase;letter-spacing:.3vmin;margin-bottom:.5vmin}
.roundTag{position:fixed;left:2vmin;bottom:2vmin;z-index:5;font-weight:700;font-size:2.2vmin;color:#cdd9f7;letter-spacing:.25vmin;background:rgba(8,20,50,.7);padding:.8vmin 1.6vmin;border-radius:1vmin;text-transform:uppercase}
.startOverlay{position:fixed;inset:0;z-index:50;background:rgba(4,10,28,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3.5vh;cursor:pointer;text-align:center}
.startOverlay h2{font-family:var(--ffh);font-weight:800;font-size:4.4vmin;color:var(--gold-hi);letter-spacing:.3vmin;text-transform:uppercase}
.connDot{position:fixed;top:1.2vmin;right:1.4vmin;z-index:60;font-size:1.6vmin;color:var(--muted);background:rgba(0,0,0,.35);padding:.4vmin 1.1vmin;border-radius:1vmin}

/* fast money */
.fmWrap{display:flex;flex-direction:column;align-items:center;gap:3vh;width:min(92vw,158vh)}
.fmTitle{font-family:var(--ffh);font-weight:900;font-style:italic;font-size:7vmin;background:linear-gradient(#fff6d6,#ffd66b 48%,#f2a51c 52%,#c47a07);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 .5vmin 0 #5a3204)}
.fmBoard{display:grid;grid-template-columns:1fr 1fr;gap:1.8vh 2.4vw;width:100%;padding:3vh 2.4vw;border-radius:2.6vh;background:linear-gradient(#0b1f4f,#071434);border:.7vh solid var(--gold);box-shadow:0 0 0 .45vh var(--gold-lo),inset 0 0 3vh rgba(0,0,0,.7)}
.fmRow{display:flex;gap:.9vw;height:8.4vh}
.fmRow .a,.fmRow .p{border-radius:1.1vh;display:flex;align-items:center;background:linear-gradient(#4a87f2,#2558cf 55%,#1c47b0);border:.25vh solid rgba(190,215,255,.55);font-weight:700;text-transform:uppercase;text-shadow:0 .2vh .4vh rgba(0,0,0,.45)}
.fmRow .a{flex:1;padding:0 1.4vw;font-size:min(3.2vh,2vw);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.fmRow .p{width:10vh;justify-content:center;font-family:var(--ffh);font-weight:800;font-size:4.2vh;background:linear-gradient(#143379,#0b1f52)}
.fmRow .blank{background:linear-gradient(#0f2862,#0a1c4a)!important;border-color:rgba(120,150,220,.25)!important;color:transparent!important;text-shadow:none!important}
.fmRow .a.reveal{animation:xin .3s}
.fmFoot{display:flex;align-items:center;gap:5vw}
.fmTotal{font-family:var(--ffh);font-weight:800;font-size:5vh;display:flex;align-items:center;gap:1.6vw;letter-spacing:.1em}
.fmTimer{font-family:var(--ffh);font-weight:800;font-size:11vh;color:var(--gold-hi);min-width:16vh;text-align:center;text-shadow:0 0 3vh rgba(242,181,68,.6)}
.fmTimer.low{color:#ff7b6b}

/* ---------- phone ---------- */
body.phone .stage{--rayY:58%}
#player{position:relative;z-index:2;min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding:calc(16px + env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom));gap:16px;text-align:center;max-width:520px;margin:0 auto}
.pJoin{width:100%;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px}
.pJoin .card{display:flex;flex-direction:column;gap:14px;padding:22px 18px}
.pJoin #pName{font-size:26px;min-height:62px;font-weight:700;letter-spacing:.02em}
.pJoin #pName::placeholder{font-size:20px;font-weight:500;color:#7f8fb8}
.pJoin .lbl{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.14em;font-weight:600;text-align:left;margin-bottom:-4px}
.teamPick{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.teamPick button{min-height:58px;border-radius:14px;border:2px solid transparent;font-size:17px;font-weight:700;color:#fff;text-transform:uppercase;letter-spacing:.06em;padding:0 8px;background:var(--t1);opacity:.75;transition:opacity .15s,box-shadow .15s,border-color .15s}
.teamPick button.t2{background:var(--t2)}
.teamPick button.sel{opacity:1;border-color:var(--gold-hi);box-shadow:0 0 0 3px rgba(242,181,68,.35)}
.pTeams{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pTeam{border-radius:16px;padding:12px 10px;background:rgba(59,130,246,.18);border:1.5px solid rgba(59,130,246,.55);display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.pTeam.t2{background:rgba(240,100,79,.16);border-color:rgba(240,100,79,.55)}
.pTeam.mine{border-color:var(--gold);box-shadow:0 0 0 2px rgba(242,181,68,.3)}
.pTeam .tn{font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pTeam .ts{font-family:var(--ffh);font-weight:800;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.pQ{font-size:16px;line-height:1.35;color:#d7e1fb;font-weight:600;min-height:44px;display:flex;align-items:center;justify-content:center;padding:0 6px}
.pBuzzArea{flex:1;width:100%;display:flex;align-items:center;justify-content:center;min-height:0}
.pTop{width:100%;margin-top:11vh;display:flex;flex-direction:column;gap:14px}
.buzzRing{width:min(78vw,42vh,360px);aspect-ratio:1;border-radius:50%;padding:4.5%;flex:none;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(160deg,#ffe7a6,var(--gold) 45%,#b07a12);box-shadow:0 0 0 5px rgba(120,80,10,.85),0 24px 44px rgba(0,0,0,.55)}
.buzzBtn{width:100%;height:100%;border-radius:50%;border:none;font-family:var(--ffh);font-weight:800;font-size:min(13vw,7.5vh,60px);letter-spacing:.06em;color:#fff;
  background:radial-gradient(circle at 50% 38%,#ff8b78,var(--t2) 58%,#a8321f);box-shadow:inset 0 -12px 0 rgba(0,0,0,.2),inset 0 10px 18px rgba(255,255,255,.28),0 2px 6px rgba(0,0,0,.35);
  text-shadow:0 3px 0 rgba(0,0,0,.25);-webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none;-webkit-user-select:none;transition:transform .08s,filter .2s}
.buzzBtn.t1{background:radial-gradient(circle at 50% 38%,#8cb8ff,var(--t1) 58%,#1c3fae)}
.buzzBtn:disabled{filter:saturate(.25) brightness(.6)}
.buzzBtn:active:not(:disabled){transform:scale(.96)}
.pStatus{font-family:var(--ffh);font-weight:800;font-size:18px;letter-spacing:.12em;text-transform:uppercase;padding:12px 20px;border-radius:999px;background:rgba(8,20,50,.75);border:1px solid var(--line);min-width:220px}
.pStatus.win{color:#2a1a00;background:var(--gold);border-color:var(--gold-hi)}
.pStatus.open{color:#fff;background:var(--ok);border-color:#5fe39b}
.pFoot{font-size:12px;color:var(--muted)}

/* ---------- host ---------- */
#host{position:relative;z-index:2;min-height:100%;padding:18px;background:linear-gradient(#081536,#06102a)}
.hHead{display:grid;grid-template-columns:auto auto 1fr auto;align-items:center;gap:18px;margin-bottom:16px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 18px}
@media(max-width:900px){.hHead{grid-template-columns:1fr 1fr}}
.hCode .small{margin-bottom:2px}
.hCode .code{font-family:var(--ffh);font-weight:800;font-size:30px;color:var(--gold-hi);letter-spacing:.18em}
.hInfo{min-width:0}
.hInfo .small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hActions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.hBtn{padding:9px 14px;border-radius:10px;border:1px solid transparent;font-weight:700;font-size:13px;color:var(--ink);background:var(--panel2);border-color:var(--line);text-transform:uppercase;letter-spacing:.06em;transition:filter .15s,transform .06s;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.hBtn:hover{filter:brightness(1.15)}
.hBtn:active{transform:translateY(1px)}
.hBtn.gold{background:linear-gradient(var(--gold-hi),var(--gold));color:#2a1a00;border-color:transparent}
.hBtn.red{background:var(--bad);border-color:transparent;color:#fff}
.hBtn.green{background:var(--ok);border-color:transparent;color:#05250f}
.hBtn.on{border-color:var(--gold);color:var(--gold-hi)}
.hBtn.sel{background:var(--gold);color:#2a1a00;border-color:transparent}
.hBar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
.hBar .lab{font-size:12px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-right:4px;font-weight:700}

<body>
<div class="stage"><div class="rays"></div></div>
<div id="landing" class="hidden"></div>
<div id="display" class="hidden"></div>
<div id="player" class="hidden"></div>
<div id="host" class="hidden"></div>
<script>
(()=>{
'use strict';
const DATA = window.FEUD_DATA || {title:'Family Feud',questions:[],fastMoney:[]};
const PREFIX = 'adultfeud-ta-';
const FIXED_CODE = String(DATA.code||'AAHJT').toUpperCase();
const $ = (s,el=document)=>el.querySelector(s);
const esc = s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS = {get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const baseURL = location.origin + location.pathname;
const params = new URLSearchParams(location.search);
const logoHTML = (w)=>'<div class="logo" style="--lw:'+w+'"><div class="lt">FAMILY<br>FEUD</div></div>';
/* ================= SOUND (original, synthesized) ================= */
const SFX = (()=>{
  let ctx=null, master=null;
  function ac(){ if(!ctx){ const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; ctx=new C(); master=ctx.createGain(); master.gain.value=.7; master.connect(ctx.destination);} if(ctx.state==='suspended') ctx.resume(); return ctx; }
  function tone(f,t0,dur,{type='sine',vol=.3,attack=.005,release=null,detune=0,filter=null,dest=null}={}){
    const c=ac(); if(!c) return; const o=c.createOscillator(), g=c.createGain(); o.type=type; o.frequency.setValueAtTime(f,t0); o.detune.value=detune;
    g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(vol,t0+attack); g.gain.exponentialRampToValueAtTime(.0001,t0+(release??dur));
    let n=o; if(filter){const fl=c.createBiquadFilter(); fl.type='lowpass'; fl.frequency.value=filter; o.connect(fl); n=fl;}
    n.connect(g); g.connect(dest||master); o.start(t0); o.stop(t0+(release??dur)+.05);
  }
  function noise(t0,dur,vol=.2,hp=1500){ const c=ac(); if(!c) return; const b=c.createBuffer(1,c.sampleRate*dur,c.sampleRate), d=b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    const s=c.createBufferSource(); s.buffer=b; const f=c.createBiquadFilter(); f.type='highpass'; f.frequency.value=hp; const g=c.createGain(); g.gain.setValueAtTime(vol,t0); g.gain.exponentialRampToValueAtTime(.0001,t0+dur); s.connect(f); f.connect(g); g.connect(master); s.start(t0); }
  const now=()=>{const c=ac(); return c?c.currentTime+.02:0};
  const lib={
    ding(){ const t=now(); [1318.5,1975.5,2637].forEach((f,i)=>tone(f,t,1.6,{vol:[.35,.18,.08][i]})); [1318.5,1975.5].forEach((f,i)=>tone(f,t+.16,1.4,{vol:[.25,.12][i]})); },
    strike(){ const t=now(); [98,103.8,146.8].forEach(f=>tone(f,t,.95,{type:'sawtooth',vol:.22,release:.95,filter:1400})); tone(49,t,.95,{type:'square',vol:.12,filter:600}); },
    buzz(){ const t=now(); tone(880,t,.12,{type:'square',vol:.18}); tone(1174.7,t+.12,.28,{type:'square',vol:.18}); },
    zero(){ const t=now(); tone(311,t,.35,{type:'triangle',vol:.3}); tone(233,t+.35,.6,{type:'triangle',vol:.3}); },
    win(){ const t=now(); [523.3,659.3,784,1046.5,1318.5].forEach((f,i)=>{tone(f,t+i*.09,.5,{type:'triangle',vol:.22}); tone(f*2,t+i*.09,.3,{vol:.06});}); [1046.5,1318.5,1568].forEach(f=>tone(f,t+.5,1.4,{type:'triangle',vol:.14})); for(let i=0;i<6;i++) noise(t+.5+i*.07,.25,.05,4000); },
    tick(){ const t=now(); tone(1600,t,.05,{type:'square',vol:.08}); },
    timeup(){ lib.strike(); },
    reveal(){ const t=now(); tone(660,t,.08,{type:'square',vol:.12}); tone(990,t+.07,.18,{type:'square',vol:.12}); },
    applause(){ const t=now(); for(let i=0;i<40;i++) noise(t+Math.random()*2.4,.05+Math.random()*.08,.05+Math.random()*.08,1200+Math.random()*2500); },
    theme(){ // original upbeat game-show jingle
      const t=now(), bpm=152, b=60/bpm;
      const mel=[ // [beat, midi, len]
        [0,72,.5],[.5,76,.5],[1,79,1],[2,81,.5],[2.5,79,.5],[3,76,1],
        [4,77,.5],[4.5,81,.5],[5,84,1],[6,83,.5],[6.5,81,.5],[7,79,1],
        [8,72,.5],[8.5,76,.5],[9,79,1],[10,84,.5],[10.5,83,.5],[11,81,.75],[11.75,79,.25],
        [12,77,.5],[12.5,79,.5],[13,81,.5],[13.5,83,.5],[14,84,2]];
      const bass=[[0,48],[1,55],[2,48],[3,55],[4,53],[5,60],[6,53],[7,55],[8,48],[9,55],[10,57],[11,53],[12,53],[13,55],[14,48]];
      const chords=[[0,[60,64,67]],[4,[60,65,69]],[8,[60,64,67]],[10,[57,60,65]],[12,[55,59,62]],[14,[60,64,67,72]]];
      const hz=m=>440*Math.pow(2,(m-69)/12);
      mel.forEach(([bt,m,l])=>{ tone(hz(m),t+bt*b,l*b*.95,{type:'sawtooth',vol:.11,filter:3200,release:l*b*.95}); tone(hz(m),t+bt*b,l*b*.95,{type:'square',vol:.05,detune:7,filter:2400,release:l*b*.95}); });
      bass.forEach(([bt,m])=>tone(hz(m),t+bt*b,b*.9,{type:'triangle',vol:.28,release:b*.9}));
      chords.forEach(([bt,ns],i)=>{ const len=(i<chords.length-1?chords[i+1][0]-bt:2)*b; ns.forEach(m=>tone(hz(m),t+bt*b,len,{type:'sawtooth',vol:.035,filter:1800,attack:.03,release:len})); });
      for(let i=0;i<16;i++){ noise(t+i*b,.06,.12,6000); if(i%2) noise(t+i*b,.16,.16,1200); tone(60,t+i*b,.12,{type:'sine',vol:i%2?0:.35,release:.12}); }
      [72,76,79,84].forEach(m=>tone(hz(m),t+14*b,2.2*b,{type:'triangle',vol:.1,release:2.2*b}));
    }
  };
  const custom={}, playing=new Set();
  function playCustom(n){ const url=custom[n]; if(!url) return false; const a=new Audio(url); playing.add(a); a.onended=()=>playing.delete(a); a.play().catch(()=>{}); return true; }
  function stopAll(){ playing.forEach(a=>{ try{a.pause()}catch(e){} }); playing.clear(); }
  return {unlock:ac, custom, stopAll, play:n=>{
    if(n==='stop'){ stopAll(); return; }
    if(playCustom(n)) return;
    if(n==='timeup' && playCustom('strike')) return;
    try{ lib[n]&&lib[n](); }catch(e){} }};
})();

/* ================= CUSTOM SOUNDS (stored only in this browser) ================= */
const SOUND_SLOTS=[['theme','Theme song'],['ding','Correct answer'],['strike','Strike buzzer'],['buzz','Buzz-in'],['win','Points awarded'],['applause','Applause'],['zero','Fast Money zero / duplicate'],['timeup','Fast Money time up']];
const SoundStore=(()=>{
  let dbp=null, names={}; const bc=('BroadcastChannel' in window)?new BroadcastChannel('ff-sounds'):null; const api={onchange:null};
  function db(){ if(!dbp) dbp=new Promise((res,rej)=>{ try{ const r=indexedDB.open('ff-sounds',1); r.onupgradeneeded=()=>r.result.createObjectStore('s'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }catch(e){ rej(e); } }); return dbp; }
  async function load(){
    try{ const d=await db(); await new Promise(res=>{ const t=d.transaction('s','readonly'), st=t.objectStore('s'), rk=st.getAllKeys(), rv=st.getAll();
      t.oncomplete=()=>{ Object.keys(SFX.custom).forEach(k=>{ URL.revokeObjectURL(SFX.custom[k]); delete SFX.custom[k]; }); names={};
        rk.result.forEach((k,i)=>{ SFX.custom[k]=URL.createObjectURL(rv.result[i].blob); names[k]=rv.result[i].name; }); res(); };
      t.onerror=()=>res(); }); }catch(e){}
    if(api.onchange) api.onchange(); return names;
  }
  async function write(fn){ const d=await db(); await new Promise((res,rej)=>{ const t=d.transaction('s','readwrite'); fn(t.objectStore('s')); t.oncomplete=res; t.onerror=()=>rej(t.error); }); await load(); if(bc) bc.postMessage('reload'); }
  if(bc) bc.onmessage=()=>load();
  api.load=load; api.names=()=>names;
  api.set=(k,file)=>write(st=>st.put({blob:file,name:file.name},k));
  api.del=k=>write(st=>st.delete(k));
  return api;
})();
SoundStore.load();
function wireSoundPanel(container,rerender){
  container.addEventListener('change',e=>{ const t=e.target; if(t.dataset&&t.dataset.snd&&t.files&&t.files[0]) SoundStore.set(t.dataset.snd,t.files[0]).then(rerender); });
  container.addEventListener('click',e=>{ const t=e.target.closest('[data-sndtest],[data-sndreset]'); if(!t) return; e.stopPropagation();
    if(t.dataset.sndtest){ SFX.unlock(); SFX.stopAll(); SFX.play(t.dataset.sndtest); }
    if(t.dataset.sndreset) SoundStore.del(t.dataset.sndreset).then(rerender); });
}

/* ================= QR ================= */
function qrSVG(text){ try{ const q=qrcode(0,'M'); q.addData(text); q.make(); return q.createSvgTag({cellSize:4,margin:0,scalable:true}); }catch(e){ return ''; } }

/* ================= NETWORK HELPERS ================= */
function makeCode(){ const L='ABCDEFGHJKMNPQRSTUVWXYZ'; let s=''; for(let i=0;i<4;i++) s+=L[Math.floor(Math.random()*L.length)]; return s; }
function peerOpts(){ return {debug:0, config:{iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:global.stun.twilio.com:3478'}]}}; }

/* client connection with auto-reconnect */
function connectClient(code, hello, onMsg, onStatus){
  let peer=null, conn=null, dead=false, timer=null;
  function start(){
    onStatus('connecting');
    if(peer){ try{peer.destroy()}catch(e){} }
    peer=new Peer(undefined, peerOpts());
    peer.on('open',()=>{
      conn=peer.connect(PREFIX+code,{reliable:true});
      conn.on('open',()=>{ onStatus('connected'); conn.send(hello()); });
      conn.on('data',onMsg);
      conn.on('close',()=>{ onStatus('lost'); retry(); });
      conn.on('error',()=>{ onStatus('lost'); retry(); });
    });
    peer.on('error',e=>{ onStatus(e&&e.type==='peer-unavailable'?'nohost':'lost'); retry(); });
    peer.on('disconnected',()=>{ try{peer.reconnect()}catch(e){} });
  }
  function retry(){ if(dead||timer) return; timer=setTimeout(()=>{timer=null; start();},2500); }
  start();
  return { send:m=>{ if(conn&&conn.open) conn.send(m); }, reconnect:()=>{ if(!conn||!conn.open) start(); } };
}

function soundPanelHTML(){
  const nm=SoundStore.names();
  return '<div class="sndList">'+SOUND_SLOTS.map(([k,l])=>'<div class="sndRow"><div class="sl">'+esc(l)+'<div class="sf">'+(nm[k]?'♪ '+esc(nm[k]):'Built-in sound')+'</div></div>'+
    '<label class="hBtn gold sndLoad">Load file<input type="file" accept="audio/*" data-snd="'+k+'" hidden></label>'+
    '<button class="hBtn" data-sndtest="'+k+'">▶ Test</button>'+(nm[k]?'<button class="hBtn" data-sndreset="'+k+'">Reset</button>':'')+'</div>').join('')+'</div>'+
    '<div class="small" style="margin-top:10px">Files stay in this browser only and are never uploaded. A TV window open in this same browser uses them too. A TV on a different device needs its own files, loaded from the TV\'s start screen.</div>';
}
function xSVG(){ return '<svg viewBox="0 0 100 100"><defs><linearGradient id="xg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff6f6a"/><stop offset="1" stop-color="#d23a3f"/></linearGradient></defs>'+
  '<path d="M17 8 L50 41 L83 8 L92 17 L59 50 L92 83 L83 92 L50 59 L17 92 L8 83 L41 50 L8 17 Z" fill="url(#xg)" stroke="url(#xg)" stroke-width="7" stroke-linejoin="round"/></svg>'; }

/* ================= ROUTER ================= */
const role = params.has('host')?'host': params.get('display')?'display': params.has('join')?'player':'landing';
if(role==='landing') initLanding();
if(role==='host') initHost();
if(role==='display') initDisplay(params.get('display').toUpperCase());
if(role==='player') initPlayer((params.get('join')||'').toUpperCase());

/* ================= LANDING ================= */
function initLanding(){
  const root=$('#landing'); root.classList.remove('hidden');
  root.innerHTML=logoHTML('min(78vw,360px)')+'<div class="card stack"><button class="btn gold" id="btnHost">Host a game</button>'+
    '<div class="muted" style="margin-top:6px">Joining? Enter the code on the TV</div><input class="field" id="landCode" maxlength="6" placeholder="CODE" autocomplete="off" style="text-transform:uppercase;letter-spacing:.2em">'+
    '<button class="btn blue" id="btnJoin">Join game</button></div>';
  $('#btnHost').onclick=()=>{ location.href=baseURL+'?host'; };
  const go=()=>{ const c=$('#landCode').value.trim().toUpperCase(); if(c.length>=4) location.href=baseURL+'?join='+c; };
  $('#btnJoin').onclick=go; $('#landCode').addEventListener('keydown',e=>{ if(e.key==='Enter') go(); });
}

/* ================= DISPLAY ================= */
function initDisplay(code){
  const root=$('#display'); root.classList.remove('hidden');
  let S=null, prevStrikeTs=0, prevBuzzTs=0, audioOn=false, lastScreen='', primed=false;
  const joinURL=baseURL+'?join='+code;
  root.innerHTML='<div class="connDot" id="dConn">connecting…</div><div id="dMain" style="width:100%;display:flex;justify-content:center"></div>'+
    '<div class="startOverlay" id="dStart">'+logoHTML('44vmin')+'<h2>Click anywhere to start the show</h2><div class="muted">Turns on sound and full screen</div><button class="hBtn" id="dSnd">Custom sounds for this screen</button></div>';
  $('#dSnd').onclick=e=>{ e.stopPropagation(); const m=document.createElement('div'); m.className='sndModal';
    const draw=()=>{ m.innerHTML='<div class="panel"><h3>Custom sounds <button class="hBtn" data-close="1">Close</button></h3>'+soundPanelHTML()+'</div>'; };
    draw(); wireSoundPanel(m,draw); m.addEventListener('click',ev=>{ ev.stopPropagation(); if(ev.target.dataset.close) m.remove(); }); document.body.appendChild(m); };
  $('#dStart').onclick=()=>{ SFX.unlock(); audioOn=true; $('#dStart').remove(); try{ const p=document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen(); if(p&&p.catch) p.catch(()=>{}); }catch(e){} };
  connectClient(code,()=>({t:'hello',role:'display'}),msg=>{
    if(msg.t==='state'){ S=msg.s; if(!primed){ primed=true; prevStrikeTs=S.strike?S.strike.ts:0; prevBuzzTs=S.buzz&&S.buzz.first?S.buzz.ts:0; } render(); }
    if(msg.t==='sfx' && audioOn) SFX.play(msg.n);
  },st=>{ const d=$('#dConn'); d.textContent= st==='connected'?'● live':st==='nohost'?'waiting for host…':'reconnecting…'; d.style.color=st==='connected'?'#5fe39b':'#ffb3b3'; });

  function render(){
    if(!S) return;
    const main=$('#dMain');
    if(S.screen!==lastScreen){ main.innerHTML=''; main.dataset.k=''; lastScreen=S.screen; }
    if(S.screen==='title') renderTitle(main); else if(S.screen==='fm') renderFM(main); else renderBoard(main);
    let cq=$('#cornerQR');
    if(S.screen!=='title' && S.showQR){ if(!cq){ cq=document.createElement('div'); cq.id='cornerQR'; cq.className='cornerQR'; cq.innerHTML='<div class="qr">'+qrSVG(joinURL)+'</div><div><div class="s">Join</div><div class="c">'+esc(code)+'</div></div>'; document.body.appendChild(cq);} }
    else if(cq) cq.remove();
    if(S.strike && S.strike.ts!==prevStrikeTs){ prevStrikeTs=S.strike.ts; showStrikes(S.strike.n); }
    if(S.buzz && S.buzz.first && S.buzz.ts!==prevBuzzTs){ prevBuzzTs=S.buzz.ts; showBuzz(S.buzz.first); }
    if(S.buzz && !S.buzz.first){ const bb=$('#buzzBanner'); if(bb) bb.remove(); prevBuzzTs=0; }
  }
  function renderTitle(main){
    if(main.dataset.k===code) return; main.dataset.k=code;
    main.innerHTML='<div class="titleScreen">'+logoHTML('min(62vmin,80vw)')+'</div>'+

  const hello=()=>({t:'hello',role:'player',pid:me.pid,name:me.name,team:me.team,joined:!!me.joined});

      '<button class="btn gold" id="pGo" style="margin-top:8px">Let\'s play</button><div class="muted" id="pConn"></div></div></div>';

    updConn();
  }
  function playView(){
    root.innerHTML='<div class="pTop"><div class="pTeams"><div class="pTeam" id="pT0"><div class="tn"></div><div class="ts">0</div></div><div class="pTeam t2" id="pT1"><div class="tn"></div><div class="ts">0</div></div></div>'+
      '<div class="pQ" id="pQ"></div></div><div class="pBuzzArea"><div class="buzzRing"><button class="buzzBtn" id="pBuzz" disabled>BUZZ</button></div></div><div class="pStatus" id="pStat"></div><div class="pFoot" id="pConn"></div>';
    const bz=$('#pBuzz');
    const press=e=>{ e.preventDefault(); if(bz.disabled) return; SFX.unlock(); SFX.play('buzz'); try{navigator.vibrate&&navigator.vibrate(120)}catch(x){} net.send({t:'buzz',pid:me.pid}); bz.disabled=true; setStat('Buzzed!',''); };
    bz.addEventListener('touchstart',press,{passive:false}); bz.addEventListener('mousedown',press);

  function alignRays(){ const b=$('#pBuzz'); if(!b) return; const r=b.getBoundingClientRect(); document.querySelector('.stage').style.setProperty('--rayY',((r.top+r.height/2)/innerHeight*100).toFixed(2)+'%'); }
  addEventListener('resize',()=>requestAnimationFrame(alignRays));
  function setStat(t,cls){ const st=$('#pStat'); if(!st) return; st.textContent=t; st.className='pStatus'+(cls?' '+cls:''); }
  function renderPlay(){
    if(!S||!$('#pBuzz')) return;
    [0,1].forEach(i=>{ const el=$('#pT'+i); $('.tn',el).textContent=S.teams[i].name; $('.ts',el).textContent=S.teams[i].score; el.classList.toggle('mine',me.team===i); });
    const bz=$('#pBuzz'); bz.className='buzzBtn'+(me.team===0?' t1':'');
    $('#pQ').textContent = S.screen==='board'&&S.round&&!S.round.hideQ ? S.round.q : (S.screen==='fm'?'Fast Money!':'Get ready…');
    const B=S.buzz||{};
    if(B.first){ bz.disabled=true; if(B.first.pid===me.pid) setStat('You buzzed first!','win'); else setStat((B.first.name||S.teams[B.first.team].name)+' buzzed first',''); }
    else if(B.open){ bz.disabled=false; setStat('Buzzers open!','open'); }
    else { bz.disabled=true; setStat('Buzzers locked',''); }
  }
  function updConn(){ const c=$('#pConn'); if(c) c.textContent= status==='connected'?'● Connected':status==='nohost'?'Waiting for the host…':'Connecting…'; }
  net=connectClient(code,hello,msg=>{
    if(msg.t==='state'){ S=msg.s; if(me.joined){ if(!$('#pBuzz')) playView(); else renderPlay(); } else if($('.teamPick')){ const bs=root.querySelectorAll('.teamPick button'); bs[0].textContent=S.teams[0].name; bs[1].textContent=S.teams[1].name; } }
    if(msg.t==='you'){ me.name=msg.name; me.team=msg.team; if(msg.joined===false){ me.joined=false; save(); joinView(); return; } me.joined=true; save(); if(!$('#pBuzz')) playView(); else renderPlay(); }
    if(msg.t==='sfx'&&msg.n==='buzzopen'){ try{navigator.vibrate&&navigator.vibrate(40)}catch(e){} }
  },st=>{ status=st; updConn(); });
  if(me.joined) playView(); else joinView();
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden) net.reconnect(); });
}

/* ================= HOST ================= */
function initHost(){
  const root=$('#host'); root.classList.remove('hidden');
  document.querySelector('.stage').style.display='none';
  const QKEY='ff-q-override', clone=x=>JSON.parse(JSON.stringify(x));
  const loadQ=()=>{ const o=LS.get(QKEY,null); return (o&&Array.isArray(o.questions)&&o.questions.length)?o.questions:clone(DATA.questions); };
  let Q=loadQ(), edited=!!(LS.get(QKEY,null)), draft=null;
  const saveQ=()=>{ LS.set(QKEY,{questions:Q,ts:Date.now()}); edited=true; };
  const FMQ=(DATA.fastMoney||[]).slice(0,5); while(FMQ.length<5) FMQ.push('Fast Money question '+(FMQ.length+1));
  const blankFM=()=>[0,1].map(()=>[0,1,2,3,4].map(()=>({a:'',p:'',ra:false,rp:false})));
  let G=LS.get('ff-host',null);
  if(!G){ G={teams:[{name:'Team 1',score:0},{name:'Team 2',score:0}],screen:'title',qi:0,revealed:[],unscored:[],bank:0,mult:1,strikes:0,strike:null,awarded:false,control:null,hideQ:false,showQR:true,
    buzz:{open:false,first:null,ts:0},fm:{rows:blankFM(),hideP1:false,timer:{running:false,left:0}},hostSound:false,players:{}}; }
  G.code=FIXED_CODE; G.qi=Math.max(0,Math.min(Q.length-1,G.qi||0)); G.players=G.players||{}; G.strikesT=G.strikesT||[0,0]; G.buzz=G.buzz||{open:false,first:null,ts:0};
  if(G.fm&&G.fm.timer) G.fm.timer.running=false;
  const conns=new Map();
  let peer=null, idTries=0;
  const save=()=>LS.set('ff-host',G);
  const fmTotal=()=>{ let t=0; G.fm.rows.forEach(r=>r.forEach(c=>{ if(c.rp) t+=(+c.p||0); })); return t; };
  function pub(){
    const q=Q[G.qi]||['',[]];
    return {title:DATA.title,code:G.code,screen:G.screen,teams:G.teams,control:G.control,showQR:G.showQR,strike:G.strike,
      buzz:{open:G.buzz.open,first:G.buzz.first,ts:G.buzz.ts},
      round:{qi:G.qi,total:Q.length,q:q[0],hideQ:G.hideQ,bank:G.bank,mult:G.mult,strikes:G.strikes,slots:q[1].slice(0,8).map((a,i)=>G.revealed[i]?{r:true,a:a[0],p:a[1],u:!!G.unscored[i]}:{r:false})},
      fm:{hideP1:G.fm.hideP1,total:fmTotal(),timer:G.fm.timer,rows:G.fm.rows.map(r=>r.map(c=>({ra:c.ra,rp:c.rp,a:c.ra?c.a:'',p:c.rp?(+c.p||0):''})))}};
  }
  const sendAll=m=>conns.forEach(c=>{ if(c.conn.open) try{c.conn.send(m)}catch(e){} });
  function broadcast(){ save(); sendAll({t:'state',s:pub()}); render(); }
  function broadcastQuiet(){ save(); sendAll({t:'state',s:pub()}); }
  function sfx(n){ conns.forEach(c=>{ if(c.conn.open&&c.role==='display') try{c.conn.send({t:'sfx',n})}catch(e){} }); if(G.hostSound) SFX.play(n); }
  function tellPlayer(pid,extra){ const p=G.players[pid]; conns.forEach(c=>{ if(c.pid===pid&&c.conn.open){ c.name=p.name; c.team=p.team; try{c.conn.send(Object.assign({t:'you',name:p.name,team:p.team},extra||{}))}catch(e){} } }); }

  function startPeer(){
    if(peer){ try{peer.destroy()}catch(e){} }
    setNet('Starting…');
    peer=new Peer(PREFIX+G.code, peerOpts());
    peer.on('open',()=>{ idTries=0; setNet('● Live, players can join'); });
    peer.on('connection',conn=>{
      conn.on('open',()=>{ conns.set(conn.peer,{conn,role:'?'}); conn.send({t:'state',s:pub()}); render(); });
      conn.on('data',m=>onMsg(conn,m));
      conn.on('close',()=>{ conns.delete(conn.peer); render(); });
      conn.on('error',()=>{ conns.delete(conn.peer); render(); });
    });
    peer.on('disconnected',()=>{ setNet('Reconnecting…'); try{peer.reconnect()}catch(e){} });
    peer.on('error',e=>{
      if(e.type==='unavailable-id'){ idTries++; setNet('Code '+G.code+' is busy. Close any other host tab. Retrying…'); setTimeout(startPeer,idTries<3?3000:6000); }
      else { setNet('Connection issue, retrying…'); setTimeout(()=>{ if(peer.destroyed||peer.disconnected) startPeer(); },3000); }
    });
  }
  function setNet(t){ G._net=t; const el=$('#hNet'); if(el) el.textContent=t; }
  function onMsg(conn,m){
    const c=conns.get(conn.peer)||{conn};
    if(m.t==='hello'){
      c.role=m.role; c.pid=m.pid;
      if(m.role==='player'){
        const known=G.players[m.pid];
        if(known){ c.name=known.name; c.team=known.team; conns.set(conn.peer,c); tellPlayer(m.pid); }
        else if(m.joined && m.name && m.team!=null){ G.players[m.pid]={name:m.name,team:m.team}; c.name=m.name; c.team=m.team; conns.set(conn.peer,c); save(); }
        else conns.set(conn.peer,c);
      } else conns.set(conn.peer,c);
      render();
    }
    if(m.t==='buzz'){ const p=G.players[c.pid]; if(p) doBuzz({pid:c.pid,name:p.name,team:p.team}); }
  }
  function doBuzz(b){ if(!G.buzz.open||G.buzz.first||b.team==null) return; G.buzz.first=b; G.buzz.ts=Date.now(); G.buzz.open=false; G.control=b.team; sfx('buzz'); broadcast(); }

  const A={
    gotoQ(i){ G.qi=Math.max(0,Math.min(Q.length-1,i)); G.revealed=[]; G.unscored=[]; G.bank=0; G.strikes=0; G.strikesT=[0,0]; G.awarded=false; G.control=null; G.buzz={open:false,first:null,ts:0}; G.screen='board'; broadcast(); },
    reveal(i){ const a=Q[G.qi][1][i]; if(!a||G.revealed[i]) return; G.revealed[i]=true; if(!G.awarded) G.bank+=a[1]*G.mult; else G.unscored[i]=true; sfx('ding'); broadcast(); },
    hide(i){ const a=Q[G.qi][1][i]; if(!G.revealed[i]) return; G.revealed[i]=false; if(!G.unscored[i]) G.bank=Math.max(0,G.bank-a[1]*G.mult); G.unscored[i]=false; broadcast(); },
    revealRest(){ Q[G.qi][1].forEach((a,i)=>{ if(!G.revealed[i]){ G.revealed[i]=true; G.unscored[i]=true; } }); sfx('reveal'); broadcast(); },
    strike(t){ if(t==null){ flash('Set which team is in control first'); return; } G.strikesT[t]=Math.min(3,G.strikesT[t]+1); G.strike={n:G.strikesT[t],team:t,ts:Date.now()}; sfx('strike'); broadcast(); },
    oneX(){ G.strike={n:1,ts:Date.now()}; sfx('strike'); broadcast(); },
    clearStrikes(){ G.strikes=0; G.strikesT=[0,0]; broadcast(); },
    award(t){ if(G.bank<=0) return; G.teams[t].score+=G.bank; G.bank=0; G.awarded=true; G.control=t; sfx('win'); broadcast(); },
    mult(m){ let bank=0; G.mult=m; Q[G.qi][1].forEach((a,i)=>{ if(G.revealed[i]&&!G.unscored[i]) bank+=a[1]*m; }); if(!G.awarded) G.bank=bank; broadcast(); },
    openBuzz(){ G.buzz={open:true,first:null,ts:0}; sendAll({t:'sfx',n:'buzzopen'}); broadcast(); },
    lockBuzz(){ G.buzz.open=false; broadcast(); },
    resetBuzz(){ G.buzz={open:false,first:null,ts:0}; broadcast(); },
    score(t,d){ G.teams[t].score=Math.max(0,G.teams[t].score+d); broadcast(); },
    newGame(){ if(!askConfirm('newgame')) return; G.teams.forEach(t=>t.score=0); G.fm={rows:blankFM(),hideP1:false,timer:{running:false,left:0}}; A.gotoQ(0); G.screen='title'; broadcast(); },
  };
  let confirmKey=null, confirmT=0;
  function askConfirm(k){ if(confirmKey===k&&Date.now()-confirmT<4000){ confirmKey=null; return true; } confirmKey=k; confirmT=Date.now(); flash('Press again to confirm'); return false; }
  function flash(t){ const el=$('#hFlash'); if(!el) return; el.textContent=t; el.style.opacity=1; clearTimeout(flash.t); flash.t=setTimeout(()=>el.style.opacity=0,2500); }

  let fmInt=null;
  function fmStart(sec){ G.fm.timer={running:true,left:sec}; clearInterval(fmInt); let last=Date.now();
    fmInt=setInterval(()=>{ const n=Date.now(); G.fm.timer.left=Math.max(0,G.fm.timer.left-(n-last)/1000); last=n; if(G.fm.timer.left<=5&&G.fm.timer.left>0) sfx('tick'); if(G.fm.timer.left<=0){ G.fm.timer.running=false; clearInterval(fmInt); sfx('timeup'); } broadcast(); },1000); broadcast(); }
  function fmStop(){ clearInterval(fmInt); G.fm.timer.running=false; broadcast(); }

  function saveDraft(){
    if(!draft) return;
    const qtext=draft.q.trim(); const ans=draft.a.filter(a=>String(a[0]).trim()).map(a=>[String(a[0]).trim(),Math.max(0,Math.min(100,parseInt(a[1])||0))]).sort((x,y)=>y[1]-x[1]).slice(0,8);
    if(!qtext){ flash('Type the question first'); return; } if(!ans.length){ flash('Add at least one answer'); return; }
    if(draft.isNew){ Q.splice(draft.idx,0,[qtext,ans]); saveQ(); draft=null; A.gotoQ(G.qi+1); flash('Question added'); return; }
    const old=Q[draft.idx]; const wasRev=old[1].filter((a,i)=>G.revealed[i]).map(a=>a[0]), wasUns=old[1].filter((a,i)=>G.unscored[i]).map(a=>a[0]);
    Q[draft.idx]=[qtext,ans];
    if(draft.idx===G.qi){ G.revealed=ans.map(a=>wasRev.includes(a[0])); G.unscored=ans.map(a=>wasUns.includes(a[0])); }
    saveQ(); draft=null; broadcast(); flash('Saved on this laptop');
  }
  function questionsFileText(){
    return '// Edit your questions here, then commit. Format: ["Question", [["Answer", points], ...]]  (up to 8 answers, highest points first)\n'+

      Q.map(q=>'  '+JSON.stringify(q)).join(',\n')+'\n ],\n // Fast Money: 5 questions. The host types the players\' answers and points live.\n fastMoney: [\n'+
      (DATA.fastMoney||[]).map(x=>'  '+JSON.stringify(x)).join(',\n')+'\n ]\n};\n';
  }
  function showCopy(){

      '<div class="small" style="margin-bottom:8px">1. Click Copy. 2. Open questions.js on GitHub. 3. Select everything in the editor, paste, and click Commit changes. The site updates in about a minute.</div>'+
      '<div class="row"><button class="hBtn gold" data-copy="1">Copy</button><a class="hBtn" href="https://github.com/TonyAnimadu/family-feud/edit/main/questions.js" target="_blank" rel="noopener">Open questions.js on GitHub</a><span class="small" id="cpMsg"></span></div>'+
      '<textarea class="edQ" readonly rows="14" style="font-family:ui-monospace,monospace;font-size:12px"></textarea></div>';

    document.body.appendChild(md);
  }

  document.addEventListener('keydown',e=>{
    if(['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName)) return;
    if(draft) return;

  function render(){

    const live=[...conns.values()], displays=live.filter(c=>c.role==='display'), onlinePids=new Set(live.filter(c=>c.role==='player').map(c=>c.pid));
    const focus=document.activeElement&&document.activeElement.dataset?document.activeElement.dataset.f:null;
    const pids=Object.keys(G.players);
    root.innerHTML=
    '<div class="hHead">'+logoHTML('120px')+
      '<div class="hCode"><div class="small">Game code</div><div class="code">'+esc(G.code)+'</div></div>'+
      '<div class="hInfo"><div class="small" id="hNet">'+esc(G._net||'Starting…')+'</div><div class="small">'+displays.length+' TV · '+onlinePids.size+' of '+pids.length+' players online</div><div class="small" id="hFlash" style="color:var(--gold-hi);transition:opacity .4s;opacity:0">.</div></div>'+
      '<div class="hActions"><a class="hBtn gold" href="'+esc(displayURL)+'" target="_blank" rel="noopener">Open TV display</a><button class="hBtn" data-a="copyjoin">Copy join link</button><button class="hBtn '+(G.hostSound?'on':'')+'" data-a="hostsound">Sound here: '+(G.hostSound?'on':'off')+'</button></div>'+
    '</div>'+
    '<div class="hBar"><span class="lab">TV screen</span>'+['title','board','fm'].map(s=>'<button class="hBtn '+(G.screen===s?'sel':'')+'" data-a="screen" data-v="'+s+'">'+({title:'Title + QR',board:'Main game',fm:'Fast Money'})[s]+'</button>').join('')+
      '<span style="width:12px"></span><span class="lab">Sound</span><button class="hBtn" data-a="theme">♪ Theme</button><button class="hBtn" data-a="applause">Applause</button><button class="hBtn" data-a="stopsnd">■ Stop</button>'+
      '<span style="width:12px"></span><button class="hBtn '+(G.showQR?'on':'')+'" data-a="qr">Corner QR: '+(G.showQR?'on':'off')+'</button><button class="hBtn" data-a="newgame">New game</button></div>'+
    '<div class="hTeams">'+[0,1].map(t=>'<div class="hTeam '+(t?'t2':'')+'"><input data-f="tn'+t+'" data-tn="'+t+'" value="'+esc(G.teams[t].name)+'"><div class="s">'+G.teams[t].score+'</div>'+
      '<div class="row"><button class="hBtn green" data-a="award" data-v="'+t+'">Award bank</button><button class="hBtn" data-a="score" data-v="'+t+'" data-d="-5">−5</button><button class="hBtn" data-a="score" data-v="'+t+'" data-d="5">+5</button><button class="hBtn '+(G.control===t?'sel':'')+'" data-a="control" data-v="'+t+'">In control</button></div></div>').join('')+'</div>'+
    (G.screen==='fm'?fmPanel():mainPanels(q))+
    '<div class="hGrid" style="margin-top:14px"><div class="panel"><h3>Players <span class="small">Only you can change names and teams</span></h3>'+
      (pids.length? pids.map(pid=>{ const p=G.players[pid]; return '<div class="pRow"><span class="dot '+(onlinePids.has(pid)?'on':'')+'"></span><input data-f="pn'+pid+'" data-pn="'+pid+'" value="'+esc(p.name)+'" maxlength="16"><button class="tb '+(p.team?'t2':'')+'" data-a="pteam" data-v="'+pid+'">'+esc(G.teams[p.team].name)+'</button><button class="hBtn" data-a="pkick" data-v="'+pid+'" title="Remove">✕</button></div>'; }).join('')
        : '<div class="small">Nobody yet. Put the Title screen on the TV so people can scan the QR code.</div>')+
      '<div class="small" style="margin-top:10px">Tap a team button to move a player. ✕ removes them and sends them back to the join screen.</div></div>'+
      '<div class="panel"><h3>Questions <span class="small">'+(edited?'Edited on this laptop':'Using the GitHub version')+'</span></h3>'+
        '<div class="row"><button class="hBtn gold" data-a="qcopy">Copy questions file</button>'+(edited?'<button class="hBtn" data-a="qreset">Reset to GitHub version</button>':'')+'</div>'+
        '<div class="small">'+(edited?'Your edits are saved in this browser only. To make them permanent, copy the file and paste it into questions.js on GitHub.':'Edit any question with ✎ Edit on the Answers panel.')+'</div></div>'+
      '</div><div class="hGrid" style="margin-top:14px">'+
      '<div class="panel"><h3>Links and shortcuts</h3><div class="small">Site: <a href="'+esc(baseURL)+'" target="_blank" rel="noopener">'+esc(baseURL)+'</a></div><div class="small">Join link: '+esc(joinURL)+'</div><div class="small">TV link: '+esc(displayURL)+'</div>'+
      '<div class="small" style="margin-top:8px">Keyboard: <kbd>A</kbd> Team 1 buzz · <kbd>L</kbd> Team 2 buzz · <kbd>1</kbd>–<kbd>8</kbd> flip · <kbd>X</kbd> strike for the team in control</div></div></div>'+
    '<div class="panel" style="margin-top:14px"><h3>Custom sounds</h3>'+soundPanelHTML()+'</div>';
    if(focus){ const el=root.querySelector('[data-f="'+focus+'"]'); if(el){ el.focus(); try{ const v=el.value; el.setSelectionRange(v.length,v.length);}catch(e){} } }
  }
  function mainPanels(q){
    const B=G.buzz;
    return '<div class="hGrid"><div class="panel"><h3>Round '+(G.qi+1)+' of '+Q.length+'</h3>'+
      '<div class="row"><button class="hBtn" data-a="prev">◀ Prev</button><select class="qSel" data-a2="jump">'+Q.map((x,i)=>'<option value="'+i+'" '+(i===G.qi?'selected':'')+'>'+(i+1)+'. '+esc(x[0].replace(/^Name /,'').slice(0,60))+'</option>').join('')+'</select><button class="hBtn gold" data-a="next">Next ▶</button></div>'+
      '<div class="qText">'+esc(q[0])+'</div>'+
      '<div class="row"><button class="hBtn" data-a="qnew">＋ New question after this</button><button class="hBtn" data-a="qdel">Delete this question</button></div>'+
      '<div class="row"><span class="bankLine">BANK <span>'+G.bank+'</span></span><span style="flex:1"></span>'+[1,2,3].map(m=>'<button class="hBtn '+(G.mult===m?'sel':'')+'" data-a="mult" data-v="'+m+'">x'+m+'</button>').join('')+'</div>'+
      [0,1].map(t=>'<div class="row strikeTeam"><button class="hBtn red" data-a="strike" data-v="'+t+'">✕ Wrong: '+esc(G.teams[t].name)+'</button><div class="strikeDots">'+[1,2,3].map(i=>'<i class="'+(G.strikesT[t]>=i?'on':'')+'">X</i>').join('')+'</div></div>').join('')+
      '<div class="row"><button class="hBtn" data-a="onex">Single X (face-off)</button><button class="hBtn" data-a="clearx">Clear strikes</button></div>'+
      '<div class="row"><button class="hBtn '+(G.hideQ?'on':'')+'" data-a="hideq">Question on TV: '+(G.hideQ?'hidden':'shown')+'</button><button class="hBtn" data-a="revealrest">Reveal rest (no points)</button></div>'+
      '<h3 style="margin-top:16px">Buzzers</h3>'+
      '<div class="buzzInfo '+(B.first?'hit':B.open?'open':'')+'">'+(B.first?esc((B.first.name?B.first.name+' · ':'')+G.teams[B.first.team].name)+' buzzed first':B.open?'Buzzers open, waiting…':'Buzzers locked')+'</div>'+
      '<div class="row" style="margin-top:10px"><button class="hBtn gold" data-a="openbuzz">Open buzzers</button><button class="hBtn" data-a="lockbuzz">Lock</button><button class="hBtn" data-a="resetbuzz">Reset</button></div>'+
      '<div class="small">Opening the buzzers clears the last buzz.</div>'+
    '</div><div class="panel">'+(draft? editorHTML() :
      '<h3>Answers <span style="display:flex;gap:8px;align-items:center"><span class="small">Flip turns the tile on the TV</span><button class="hBtn" data-a="qedit">✎ Edit</button></span></h3><div class="ansList">'+
      q[1].slice(0,8).map((a,i)=>'<div class="ansItem '+(G.revealed[i]?'done':'')+'"><span class="n">'+(i+1)+'</span><span class="t">'+esc(a[0])+'</span><span class="p">'+a[1]+'</span>'+
        (G.revealed[i]?'<button class="hBtn" data-a="hide" data-v="'+i+'">Hide</button>':'<button class="hBtn gold" data-a="reveal" data-v="'+i+'">Flip</button>')+'</div>').join('')+
      '</div><div class="small" style="margin-top:10px">Flips add points to the bank. After you award the bank, more flips show grayed out with no points.</div>')+'</div></div>';
  }
  function editorHTML(){
    const tot=draft.a.reduce((s,a)=>s+(parseInt(a[1])||0),0);
    return '<h3>'+(draft.isNew?'New question':'Edit question')+' <span class="small">Saved on this laptop</span></h3>'+
      '<div class="small" style="margin-bottom:6px">Question</div><textarea class="edQ" data-f="dq" data-dq="1" rows="2" placeholder="Name something…">'+esc(draft.q)+'</textarea>'+
      '<div class="small" style="margin:10px 0 6px">Answers and points (up to 8). They sort highest first when you save.</div>'+
      draft.a.map((a,i)=>'<div class="edRow"><span class="n">'+(i+1)+'</span><input data-f="da'+i+'" data-da="'+i+'" value="'+esc(a[0])+'" placeholder="Answer"><input type="number" min="0" max="100" data-f="dp'+i+'" data-dp="'+i+'" value="'+esc(a[1])+'" placeholder="pts"><button class="hBtn" data-a="edrm" data-v="'+i+'" title="Remove">✕</button></div>').join('')+
      '<div class="row" style="margin-top:8px">'+(draft.a.length<8?'<button class="hBtn" data-a="edadd">＋ Add answer</button>':'')+'<span class="small" id="edTot">Total: '+tot+' points</span></div>'+
      '<div class="row"><button class="hBtn gold" data-a="edsave">Save</button><button class="hBtn" data-a="edcancel">Cancel</button></div>';
  }
  function fmPanel(){
    const F=G.fm;
    return '<div class="panel"><h3>Fast Money <span class="bankLine">TOTAL <span>'+fmTotal()+'</span></span></h3>'+
      '<div class="row"><button class="hBtn gold" data-a="fmt" data-v="20">Start 20s</button><button class="hBtn gold" data-a="fmt" data-v="25">Start 25s</button><button class="hBtn" data-a="fmstop">Stop timer</button>'+
      '<span class="bankLine">'+(F.timer.running||F.timer.left>0?Math.ceil(F.timer.left)+'s':'')+'</span><span style="flex:1"></span>'+
      '<button class="hBtn '+(F.hideP1?'on':'')+'" data-a="fmhide">Player 1 answers: '+(F.hideP1?'hidden':'shown')+'</button><button class="hBtn" data-a="fmdup">Duplicate buzz</button><button class="hBtn" data-a="fmclear">Clear</button></div>'+
      '<div class="fmGrid"><div class="small"><b>PLAYER 1</b></div><div class="small"><b>PLAYER 2</b></div>'+
      [0,1,2,3,4].map(r=>[0,1].map(p=>{ const c=F.rows[p][r];
        return '<div class="fmCell"><div class="q">'+(r+1)+'. '+esc(FMQ[r])+'</div><input class="a" data-f="fa'+p+r+'" data-fa="'+p+','+r+'" placeholder="Their answer" value="'+esc(c.a)+'">'+
          '<div class="row"><input class="pp" type="number" min="0" max="100" data-f="fp'+p+r+'" data-fp="'+p+','+r+'" placeholder="pts" value="'+esc(c.p)+'"><button class="hBtn '+(c.ra?'':'gold')+'" data-a="fmra" data-v="'+p+','+r+'">'+(c.ra?'Answer shown':'Show answer')+'</button><button class="hBtn '+(c.rp?'':'gold')+'" data-a="fmrp" data-v="'+p+','+r+'">'+(c.rp?'Points shown':'Show points')+'</button></div></div>';
      }).join('')).join('')+'</div><div class="small" style="margin-top:10px">Type each answer as they say it, then add the points. Hide Player 1\'s answers while Player 2 plays. Reaching 200 wins.</div></div>';
  }

  root.addEventListener('click',e=>{
    const b=e.target.closest('[data-a]'); if(!b) return; const a=b.dataset.a, v=b.dataset.v; SFX.unlock();
    switch(a){
      case 'prev': A.gotoQ(G.qi-1); break; case 'next': A.gotoQ(G.qi+1); break;
      case 'reveal': A.reveal(+v); break; case 'hide': A.hide(+v); break; case 'revealrest': A.revealRest(); break;
      case 'strike': A.strike(+v); break; case 'onex': A.oneX(); break; case 'clearx': A.clearStrikes(); break;
      case 'award': A.award(+v); break; case 'score': A.score(+v,+b.dataset.d); break; case 'control': G.control=G.control===+v?null:+v; broadcast(); break;
      case 'mult': A.mult(+v); break; case 'hideq': G.hideQ=!G.hideQ; broadcast(); break;
      case 'openbuzz': A.openBuzz(); break; case 'lockbuzz': A.lockBuzz(); break; case 'resetbuzz': A.resetBuzz(); break;
      case 'screen': G.screen=v; broadcast(); break;
      case 'theme': sfx('theme'); break; case 'applause': sfx('applause'); break; case 'stopsnd': sfx('stop'); break;
      case 'qr': G.showQR=!G.showQR; broadcast(); break;
      case 'hostsound': G.hostSound=!G.hostSound; save(); render(); break;
      case 'newgame': A.newGame(); break;
      case 'copyjoin': try{ navigator.clipboard.writeText(baseURL+'?join='+G.code).then(()=>flash('Join link copied')); }catch(x){ flash(baseURL+'?join='+G.code); } break;
      case 'pteam': { const p=G.players[v]; if(!p) break; p.team=p.team?0:1; save(); tellPlayer(v); render(); break; }
      case 'pkick': { if(!askConfirm('kick'+v)) break; tellPlayer(v,{joined:false}); delete G.players[v]; save(); render(); break; }
      case 'qedit': { const cq=Q[G.qi]; draft={idx:G.qi,isNew:false,q:cq[0],a:cq[1].map(a=>[a[0],a[1]])}; render(); break; }
      case 'qnew': draft={idx:G.qi+1,isNew:true,q:'',a:[['',''],['',''],['',''],['',''],['',''],['','']]}; if(G.screen!=='board'){ G.screen='board'; broadcast(); } else render(); break;
      case 'edadd': if(draft&&draft.a.length<8){ draft.a.push(['','']); render(); } break;
      case 'edrm': if(draft){ draft.a.splice(+v,1); if(!draft.a.length) draft.a.push(['','']); render(); } break;
      case 'edcancel': draft=null; render(); break;
      case 'edsave': saveDraft(); break;
      case 'qdel': { if(Q.length<=1){ flash('You need at least one question'); break; } if(!askConfirm('qdel')) break; Q.splice(G.qi,1); saveQ(); draft=null; A.gotoQ(Math.min(G.qi,Q.length-1)); flash('Question deleted'); break; }
      case 'qreset': { if(!askConfirm('qreset')) break; try{localStorage.removeItem(QKEY)}catch(x){} Q=clone(DATA.questions); edited=false; draft=null; A.gotoQ(Math.min(G.qi,Q.length-1)); flash('Back to the GitHub version'); break; }
      case 'qcopy': showCopy(); break;
      case 'fmt': fmStart(+v); break; case 'fmstop': fmStop(); break;
      case 'fmhide': G.fm.hideP1=!G.fm.hideP1; broadcast(); break;
      case 'fmdup': sfx('zero'); break;
      case 'fmclear': if(askConfirm('fmclear')){ G.fm.rows=blankFM(); clearInterval(fmInt); G.fm.timer={running:false,left:0}; broadcast(); } break;
      case 'fmra': { const [p,r]=v.split(',').map(Number); const c=G.fm.rows[p][r]; c.ra=!c.ra; if(c.ra) sfx('reveal'); broadcast(); break; }
      case 'fmrp': { const [p,r]=v.split(',').map(Number); const c=G.fm.rows[p][r]; c.rp=!c.rp; if(c.rp) sfx((+c.p||0)>0?'ding':'zero'); if(c.rp&&fmTotal()>=200) setTimeout(()=>sfx('win'),900); broadcast(); break; }
    }
  });
  root.addEventListener('change',e=>{
    const t=e.target;
    if(t.dataset.a2==='jump') A.gotoQ(+t.value);
    if(t.dataset.tn!=null){ G.teams[+t.dataset.tn].name=t.value.trim()||('Team '+(+t.dataset.tn+1)); broadcast(); }
    if(t.dataset.pn){ const p=G.players[t.dataset.pn]; if(p){ p.name=t.value.trim()||p.name; save(); tellPlayer(t.dataset.pn); render(); } }
  });
  root.addEventListener('input',e=>{
    const t=e.target;
    if(draft){ if(t.dataset.dq){ draft.q=t.value; return; } if(t.dataset.da!=null){ draft.a[+t.dataset.da][0]=t.value; return; } if(t.dataset.dp!=null){ draft.a[+t.dataset.dp][1]=t.value; const el=$('#edTot'); if(el) el.textContent='Total: '+draft.a.reduce((s,a)=>s+(parseInt(a[1])||0),0)+' points'; return; } }
    if(t.dataset.fa){ const [p,r]=t.dataset.fa.split(',').map(Number); G.fm.rows[p][r].a=t.value; save(); if(G.fm.rows[p][r].ra) broadcastQuiet(); }
    if(t.dataset.fp){ const [p,r]=t.dataset.fp.split(',').map(Number); G.fm.rows[p][r].p=t.value; save(); if(G.fm.rows[p][r].rp) broadcastQuiet(); }
  });
  setInterval(()=>sendAll({t:'state',s:pub()}),4000);
  wireSoundPanel(root,()=>render()); SoundStore.onchange=()=>render();
  render(); startPeer();
}
})();
</script>
</body>
</html>
