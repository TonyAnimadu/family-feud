<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Adult Family Feud</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bowlby+One&family=Oswald:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="questions.js"></script>
<style>
:root{--gold1:#ffe9a3;--gold2:#f5b82e;--gold3:#a86b00;--blue1:#2f7cf6;--blue2:#123d9c;--blue3:#071a4d;--navy:#040d2b;--red:#e3262b}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Oswald,system-ui,sans-serif;color:#fff;background:var(--navy);overflow-x:hidden}
button{font-family:inherit;cursor:pointer}
.hidden{display:none!important}

/* ---------- STAGE BACKGROUND ---------- */
.stage{position:fixed;inset:0;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#1d4fc4 0%,#0b2470 45%,#030a24 100%)}
.rays{position:absolute;left:50%;top:45%;width:260vmax;height:260vmax;transform:translate(-50%,-50%);background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.07) 0deg 6deg,rgba(255,255,255,0) 6deg 18deg);animation:spin 120s linear infinite;pointer-events:none}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.bulbs{position:absolute;inset:1.2vmin;border-radius:3vmin;pointer-events:none;background:
 radial-gradient(circle,#fff6c9 0 .35vmin,rgba(255,200,60,.6) .5vmin,transparent .9vmin) 0 0/3.2vmin 3.2vmin;
 -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;padding:1.6vmin;animation:twinkle 1.2s steps(2) infinite}
@keyframes twinkle{50%{filter:brightness(.55)}}

/* ---------- LOGO ---------- */
.logo{position:relative;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;padding:3vmin 7vmin;border-radius:50%;
 background:radial-gradient(ellipse at 50% 35%,#3f8cff,#0d3aa8 60%,#06205f);border:1.1vmin solid transparent;
 background-clip:padding-box;box-shadow:0 0 0 1.1vmin #f5b82e,0 0 0 1.6vmin #7a4a00,0 0 6vmin rgba(255,190,40,.6),inset 0 0 4vmin rgba(0,0,0,.5)}
.logo .l1{font-family:'Bowlby One';font-size:4.2vmin;letter-spacing:.3vmin;color:#fff;text-shadow:0 .5vmin 0 #0a2a7a}
.logo .l2{font-family:'Bowlby One';font-size:11vmin;line-height:.95;background:linear-gradient(#fff7cf,#ffd34d 45%,#f39c12 55%,#b86a00);-webkit-background-clip:text;background-clip:text;color:transparent;
 filter:drop-shadow(0 .6vmin 0 #5b2d00) drop-shadow(0 0 1.4vmin rgba(255,200,60,.5));letter-spacing:.2vmin}

/* ---------- LANDING ---------- */
#landing{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5vh;padding:4vh 4vw;position:relative;z-index:2;text-align:center}
.card{background:rgba(4,13,43,.82);border:2px solid #f5b82e;border-radius:18px;padding:22px;max-width:440px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.bigbtn{display:block;width:100%;padding:16px;margin:8px 0;border:none;border-radius:12px;font-size:22px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#1b1000;background:linear-gradient(#ffe48a,#f5b82e 55%,#d48a00);box-shadow:0 4px 0 #7a4a00}
.bigbtn.blue{color:#fff;background:linear-gradient(#5aa2ff,#1f5fe0 55%,#0d3aa8);box-shadow:0 4px 0 #061f63}
.bigbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #7a4a00}
input.txt{width:100%;padding:14px;border-radius:10px;border:2px solid #2f7cf6;background:#071a4d;color:#fff;font-size:20px;font-family:inherit;text-align:center;text-transform:uppercase;margin:6px 0}
.muted{color:#9fb6e8;font-size:15px}

/* ---------- DISPLAY ---------- */
#display{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center}
.titleScreen{display:flex;flex-direction:column;align-items:center;gap:4vh}
.joinBox{display:flex;align-items:center;gap:4vmin;background:rgba(4,13,43,.85);border:.5vmin solid #f5b82e;border-radius:3vmin;padding:2.5vmin 4vmin}
.joinBox .qr{background:#fff;padding:1.2vmin;border-radius:1.5vmin;width:26vmin;height:26vmin}
.joinBox .qr svg{width:100%;height:100%;display:block}
.joinBox .code{font-family:Anton;font-size:12vmin;letter-spacing:2vmin;color:#ffd34d;line-height:1}
.joinBox .lbl{font-size:3.4vmin;color:#cfe0ff;text-transform:uppercase;letter-spacing:.3vmin}
.joinBox .url{font-size:2.2vmin;color:#9fb6e8;margin-top:1vmin;word-break:break-all;max-width:50vmin}

.boardWrap{width:min(96vw,170vh);display:flex;flex-direction:column;align-items:center;gap:1.6vh}
.question{font-family:Oswald;font-weight:700;font-size:min(4.2vw,5.4vh);text-align:center;text-transform:uppercase;line-height:1.1;padding:1.2vh 3vw;max-width:94vw;text-shadow:0 .4vh 0 #000,0 0 2vh rgba(0,0,0,.6)}
.boardRow{display:flex;align-items:center;gap:2vw;width:100%;justify-content:center}
.teamBox{display:flex;flex-direction:column;align-items:center;gap:.6vh;min-width:13vw}
.teamName{font-family:Anton;font-size:min(2.6vw,3.6vh);text-transform:uppercase;letter-spacing:.2vw;padding:.4vh 1.4vw;border-radius:1vh;background:linear-gradient(#5aa2ff,#0d3aa8);border:.35vh solid #f5b82e;max-width:16vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.teamName.t2{background:linear-gradient(#ff6a6a,#a1121a)}
.scoreBox,.bankBox{font-family:Anton;font-size:min(7vw,10vh);line-height:1;padding:1vh 1.4vw;min-width:12vw;text-align:center;border-radius:1.4vh;color:#fff;background:linear-gradient(#123d9c,#040d2b);border:.6vh solid #f5b82e;box-shadow:0 0 0 .4vh #7a4a00,0 0 3vh rgba(255,190,40,.35),inset 0 0 2vh #000;text-shadow:0 0 1.5vh rgba(120,180,255,.9)}
.teamBox.active .scoreBox{animation:glow 1s ease-in-out infinite alternate}
@keyframes glow{to{box-shadow:0 0 0 .4vh #7a4a00,0 0 6vh rgba(255,220,80,.95),inset 0 0 2vh #000}}
.bankBox{font-size:min(5.5vw,8vh);min-width:10vw;margin-bottom:.4vh}
.multTag{font-family:Anton;color:#ffd34d;font-size:min(2.4vw,3.4vh);letter-spacing:.2vw}
.board{width:100%;padding:2vh 1.6vw;border-radius:3vh;background:linear-gradient(#0a2a7a,#040d2b);
 border:1vh solid transparent;box-shadow:0 0 0 1vh #f5b82e,0 0 0 1.5vh #7a4a00,0 0 0 1.9vh #ffe9a3,0 2vh 6vh rgba(0,0,0,.7),inset 0 0 4vh #000;
 display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(4,1fr);grid-auto-flow:column;gap:1.4vh 1.2vw}
.slot{height:min(9.6vh,6.6vw);perspective:120vh}
.slot .inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .75s cubic-bezier(.3,1.5,.5,1)}
.slot.flip .inner{transform:rotateX(-180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:1vh;display:flex;align-items:center;justify-content:center;
 border:.35vh solid #8fc0ff;box-shadow:inset 0 0 0 .3vh #0a2a7a,inset 0 .8vh 1.6vh rgba(255,255,255,.35),inset 0 -1vh 1.6vh rgba(0,0,0,.4)}
.front{background:linear-gradient(#3d8bff,#1854d6 50%,#0c3394)}
.front .num{font-family:Anton;font-size:min(5.6vh,3.8vw);width:min(11vh,7.6vw);height:min(6.6vh,4.5vw);display:flex;align-items:center;justify-content:center;border-radius:50%;
 background:radial-gradient(ellipse at 50% 30%,#2a6ff0,#0a2a7a);border:.4vh solid #f5b82e;box-shadow:0 0 1.5vh rgba(0,0,0,.6);text-shadow:0 .3vh 0 #000}
.slot.empty .front{background:linear-gradient(#0d2c80,#06194f);border-color:#2a4f9c}
.slot.empty .front .num{display:none}
.back{transform:rotateX(180deg);background:linear-gradient(#4a96ff,#1a5ae0 50%,#0d3aa8);justify-content:space-between;padding-left:1.2vw;overflow:hidden}
.back .ans{font-family:Oswald;font-weight:700;text-transform:uppercase;font-size:min(3.6vh,2.4vw);line-height:1.02;text-shadow:0 .3vh 0 #000;flex:1;text-align:left;padding-right:.6vw;
 display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.back .pts{font-family:Anton;font-size:min(5vh,3.4vw);width:min(9vh,6.2vw);height:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(#123d9c,#071a4d);border-left:.35vh solid #8fc0ff;text-shadow:0 0 1vh rgba(120,180,255,.9)}
.slot.unscored .back{filter:saturate(.35) brightness(.8)}

.strikes{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;gap:3vw;z-index:20;pointer-events:none}
.xmark{width:min(26vh,18vw);height:min(30vh,21vw);border-radius:2vh;background:rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;animation:pop .25s ease-out}
.xmark svg{width:100%;height:100%;filter:drop-shadow(0 0 3vh rgba(255,0,0,.8))}
@keyframes pop{from{transform:scale(2.2);opacity:0}to{transform:scale(1);opacity:1}}

.buzzBanner{position:fixed;left:50%;top:6vh;transform:translateX(-50%);z-index:15;font-family:Anton;font-size:min(5vw,7vh);text-transform:uppercase;letter-spacing:.3vw;padding:1.4vh 4vw;border-radius:2vh;
 background:linear-gradient(#ffe48a,#f5b82e 55%,#d48a00);color:#1b1000;border:.6vh solid #fff;box-shadow:0 0 6vh rgba(255,210,60,.9);animation:pop .3s ease-out,flash .5s 3 .3s;white-space:nowrap}
.buzzBanner.t2{background:linear-gradient(#ff8a8a,#e3262b 55%,#8a0b10);color:#fff}
.buzzBanner.t1{background:linear-gradient(#8ac0ff,#2f7cf6 55%,#0d3aa8);color:#fff}
@keyframes flash{50%{filter:brightness(1.6)}}
.cornerQR{position:fixed;right:1.5vmin;bottom:1.5vmin;z-index:5;background:rgba(4,13,43,.85);border:.3vmin solid #f5b82e;border-radius:1.5vmin;padding:1vmin;display:flex;align-items:center;gap:1vmin}
.cornerQR .qr{background:#fff;width:11vmin;height:11vmin;padding:.6vmin;border-radius:.8vmin}
.cornerQR .qr svg{width:100%;height:100%;display:block}
.cornerQR .c{font-family:Anton;font-size:4vmin;color:#ffd34d;letter-spacing:.6vmin;line-height:1}
.cornerQR .s{font-size:1.8vmin;color:#cfe0ff;text-transform:uppercase}
.roundTag{position:fixed;left:1.5vmin;bottom:1.5vmin;z-index:5;font-family:Anton;font-size:2.6vmin;color:#cfe0ff;letter-spacing:.2vmin;background:rgba(4,13,43,.7);padding:.6vmin 1.4vmin;border-radius:1vmin}
.startOverlay{position:fixed;inset:0;z-index:50;background:rgba(2,6,20,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3vh;cursor:pointer;text-align:center}
.startOverlay h2{font-family:Anton;font-size:6vmin;color:#ffd34d;letter-spacing:.4vmin}
.connDot{position:fixed;top:1vmin;right:1.2vmin;z-index:60;font-size:1.8vmin;color:#9fb6e8;background:rgba(0,0,0,.4);padding:.3vmin 1vmin;border-radius:1vmin}

/* fast money */
.fmWrap{display:flex;flex-direction:column;align-items:center;gap:2vh;width:min(94vw,160vh)}
.fmTitle{font-family:'Bowlby One';font-size:7vmin;background:linear-gradient(#fff7cf,#ffd34d 45%,#f39c12 55%,#b86a00);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 .5vmin 0 #5b2d00)}
.fmBoard{display:grid;grid-template-columns:1fr 1fr;gap:1.4vh 2vw;width:100%;padding:2.4vh 2vw;border-radius:3vh;background:linear-gradient(#0a2a7a,#040d2b);box-shadow:0 0 0 1vh #f5b82e,0 0 0 1.5vh #7a4a00,inset 0 0 4vh #000}
.fmRow{display:flex;gap:.8vw;height:8vh}
.fmRow .a,.fmRow .p{border-radius:1vh;display:flex;align-items:center;background:linear-gradient(#3d8bff,#1854d6 50%,#0c3394);border:.3vh solid #8fc0ff;font-weight:700;text-transform:uppercase;text-shadow:0 .3vh 0 #000}
.fmRow .a{flex:1;padding:0 1vw;font-size:min(3.6vh,2.2vw);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.fmRow .p{width:9vh;justify-content:center;font-family:Anton;font-size:4.6vh;background:linear-gradient(#123d9c,#071a4d)}
.fmRow .a.blank,.fmRow .p.blank{background:linear-gradient(#0d2c80,#06194f);border-color:#2a4f9c;color:transparent;text-shadow:none}
.fmRow .a.reveal{animation:pop .3s}
.fmFoot{display:flex;align-items:center;gap:4vw}
.fmTotal{font-family:Anton;font-size:7vh;display:flex;align-items:center;gap:1.5vw}
.fmTimer{font-family:Anton;font-size:12vh;color:#ffd34d;min-width:16vh;text-align:center;text-shadow:0 0 3vh rgba(255,200,60,.8)}
.fmTimer.low{color:#ff5a5a;animation:flash .5s infinite}

/* ---------- PLAYER ---------- */
#player{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;padding:max(16px,env(safe-area-inset-top)) 16px 16px;gap:14px;text-align:center}
.pHead{width:100%;display:flex;justify-content:space-between;align-items:center;font-family:Anton;font-size:20px;letter-spacing:1px}
.pHead .sc{display:flex;gap:10px}
.pHead .chip{padding:4px 10px;border-radius:8px;background:#0d3aa8;border:2px solid #f5b82e}
.pHead .chip.t2{background:#a1121a}
.teamPick{display:flex;gap:10px;width:100%}
.teamPick button{flex:1;padding:18px 6px;border-radius:12px;border:3px solid transparent;font-size:20px;font-weight:700;color:#fff;background:linear-gradient(#5aa2ff,#0d3aa8);text-transform:uppercase}
.teamPick button.t2{background:linear-gradient(#ff6a6a,#a1121a)}
.teamPick button.sel{border-color:#ffd34d;box-shadow:0 0 18px rgba(255,210,60,.8)}
.buzzBtn{width:min(78vw,52vh);height:min(78vw,52vh);border-radius:50%;border:none;font-family:Anton;font-size:min(16vw,11vh);letter-spacing:2px;color:#fff;margin:auto 0;
 background:radial-gradient(circle at 50% 35%,#ff8080,#e3262b 55%,#7a0a0e);box-shadow:0 12px 0 #4a0508,0 0 0 10px #f5b82e,0 0 0 16px #7a4a00,0 20px 40px rgba(0,0,0,.6);text-shadow:0 4px 0 #4a0508;-webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none}
.buzzBtn.t1{background:radial-gradient(circle at 50% 35%,#8ac0ff,#2f7cf6 55%,#0a2a7a);box-shadow:0 12px 0 #041646,0 0 0 10px #f5b82e,0 0 0 16px #7a4a00,0 20px 40px rgba(0,0,0,.6);text-shadow:0 4px 0 #041646}
.buzzBtn:disabled{filter:grayscale(.85) brightness(.55)}
.buzzBtn:active:not(:disabled){transform:translateY(8px);box-shadow:0 4px 0 #4a0508,0 0 0 10px #f5b82e,0 0 0 16px #7a4a00}
.pStatus{font-family:Anton;font-size:26px;letter-spacing:1px;min-height:36px;text-transform:uppercase}
.pStatus.win{color:#ffd34d;animation:flash .4s infinite}
.pQ{font-size:16px;color:#cfe0ff;max-width:520px}

/* ---------- HOST ---------- */
#host{position:relative;z-index:2;min-height:100%;padding:14px;background:#06102f}
.hTop{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:12px}
.hTop .code{font-family:Anton;font-size:30px;color:#ffd34d;letter-spacing:6px;background:#040d2b;border:2px solid #f5b82e;border-radius:10px;padding:2px 14px}
.hBtn{padding:9px 14px;border-radius:9px;border:none;font-weight:700;font-size:15px;color:#fff;background:#1f5fe0;box-shadow:0 3px 0 #0a2a7a;text-transform:uppercase;letter-spacing:.5px}
.hBtn:active{transform:translateY(2px);box-shadow:0 1px 0 #0a2a7a}
.hBtn.gold{background:linear-gradient(#ffe48a,#f5b82e);color:#1b1000;box-shadow:0 3px 0 #7a4a00}
.hBtn.red{background:#d4242a;box-shadow:0 3px 0 #6d0a0d}
.hBtn.green{background:#1f9d4c;box-shadow:0 3px 0 #0b4a22}
.hBtn.gray{background:#33415f;box-shadow:0 3px 0 #161e30}
.hBtn.on{outline:3px solid #ffd34d}
.hGrid{display:grid;grid-template-columns:minmax(300px,1fr) minmax(340px,1.3fr);gap:14px}
@media(max-width:820px){.hGrid{grid-template-columns:1fr}}
.panel{background:#0a1a46;border:1px solid #2a4f9c;border-radius:14px;padding:14px}
.panel h3{font-family:Anton;letter-spacing:1px;color:#ffd34d;font-size:18px;margin-bottom:10px;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.hTeam{flex:1;min-width:130px;background:#071a4d;border-radius:12px;padding:10px;border:2px solid #2f7cf6}
.hTeam.t2{border-color:#e3262b}
.hTeam input{width:100%;background:transparent;border:none;border-bottom:1px solid #2a4f9c;color:#fff;font-family:Anton;font-size:20px;text-transform:uppercase;padding:2px 0}
.hTeam .s{font-family:Anton;font-size:40px;line-height:1.1}
.hTeam .row{margin:4px 0 0}
.hTeam .row button{padding:5px 9px;font-size:13px}
.ansList{display:flex;flex-direction:column;gap:6px}
.ansItem{display:flex;align-items:center;gap:8px;background:#071a4d;border-radius:10px;padding:8px 10px;border:1px solid #2a4f9c}
.ansItem .n{font-family:Anton;color:#ffd34d;width:22px}
.ansItem .t{flex:1;font-size:17px}
.ansItem .p{font-family:Anton;font-size:20px;width:40px;text-align:right}
.ansItem.done{opacity:.55}
.ansItem.done .t{text-decoration:line-through}
.qText{font-size:19px;font-weight:600;margin-bottom:10px;line-height:1.25}
.qSel{background:#071a4d;color:#fff;border:1px solid #2a4f9c;border-radius:8px;padding:8px;font-family:inherit;font-size:15px;max-width:100%}
.bankLine{font-family:Anton;font-size:26px}
.bankLine span{color:#ffd34d}
.strikeDots{display:flex;gap:6px}
.strikeDots i{width:30px;height:30px;border-radius:6px;background:#26314f;display:flex;align-items:center;justify-content:center;font-style:normal;font-family:Anton;font-size:20px;color:#555}
.strikeDots i.on{background:#e3262b;color:#fff}
.buzzInfo{font-family:Anton;font-size:22px;padding:10px;border-radius:10px;background:#071a4d;border:2px dashed #2a4f9c;text-align:center;letter-spacing:.5px}
.buzzInfo.hit{border-style:solid;border-color:#ffd34d;color:#ffd34d}
.plist{font-size:14px;color:#cfe0ff;line-height:1.7}
.plist b{color:#fff}
.small{font-size:13px;color:#9fb6e8}
.fmGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fmCell{background:#071a4d;border-radius:10px;padding:8px;border:1px solid #2a4f9c}
.fmCell .q{font-size:13px;color:#cfe0ff;margin-bottom:6px}
.fmCell input{background:#040d2b;border:1px solid #2a4f9c;color:#fff;border-radius:6px;padding:6px;font-family:inherit;font-size:15px}
.fmCell .a{width:100%;margin-bottom:5px;text-transform:uppercase}
.fmCell .pp{width:64px}
.fmCell .row{margin:0}
.fmCell button{padding:6px 10px;font-size:13px}
.sndList{display:flex;flex-direction:column;gap:6px}
.sndRow{display:flex;align-items:center;gap:8px;background:#071a4d;border:1px solid #2a4f9c;border-radius:10px;padding:8px 10px;text-align:left}
.sndRow .sl{flex:1;font-size:16px}.sndRow .sf{font-size:12px;color:#9fb6e8;word-break:break-all}
.sndLoad{cursor:pointer;display:inline-block}
.sndModal{position:fixed;inset:0;z-index:70;background:rgba(2,6,20,.92);display:flex;align-items:center;justify-content:center;padding:20px}
.sndModal .panel{max-width:620px;width:100%;max-height:90vh;overflow:auto}
kbd{background:#26314f;border-radius:4px;padding:1px 6px;font-family:inherit}
</style>
</head>
<body>
<div class="stage"><div class="rays"></div><div class="bulbs"></div></div>

<!-- LANDING -->
<div id="landing" class="hidden">
  <div class="logo"><div class="l1" id="landTitle1">ADULT</div><div class="l2">FAMILY<br>FEUD</div></div>
  <div class="card">
    <button class="bigbtn" id="btnHost">Host a game</button>
    <div class="muted" style="margin:14px 0 4px">Joining? Enter the code on the TV</div>
    <input class="txt" id="landCode" maxlength="4" placeholder="CODE" autocomplete="off">
    <button class="bigbtn blue" id="btnJoin">Join game</button>
  </div>
</div>

<!-- DISPLAY -->
<div id="display" class="hidden"></div>

<!-- PLAYER -->
<div id="player" class="hidden"></div>

<!-- HOST -->
<div id="host" class="hidden"></div>

<script>
(()=>{
'use strict';
const DATA = window.FEUD_DATA || {title:'Family Feud',questions:[],fastMoney:[]};
const PREFIX = 'adultfeud-ta-';

/* ================= SOUND (original, synthesized) ================= */
const SFX = (()=>{
  let ctx=null, master=null;
  function ac(){ if(!ctx){ const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; ctx=new C(); master=ctx.createGain(); master.gain.value=.7; master.connect(ctx.destination);} if(ctx.state==='suspended') ctx.resume(); return ctx; }
  function tone(f,t0,dur,{type='sine',vol=.3,attack=.005,release=null,detune=0,filter=null,dest=null}={}){
    const c=ac(); if(!c) return; const o=c.createOscillator(), g=c.createGain(); o.type=type; o.frequency.setValueAtTime(f,t0); o.detune.value=detune;
    g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(vol,t0+attack); g.gain.exponentialRampToValueAtTime(.0001,t0+(release??dur));
    let n=o; if(filter){const fl=c.createBiquadFilter(); fl.type='lowpass'; fl.frequency.value=filter; o.connect(fl); n=fl;}
    n.connect(g); g.connect(dest||master); o.start(t0); o.stop(t0+(release??dur)+.05);
  }
  function noise(t0,dur,vol=.2,hp=1500){ const c=ac(); if(!c) return; const b=c.createBuffer(1,c.sampleRate*dur,c.sampleRate), d=b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    const s=c.createBufferSource(); s.buffer=b; const f=c.createBiquadFilter(); f.type='highpass'; f.frequency.value=hp; const g=c.createGain(); g.gain.setValueAtTime(vol,t0); g.gain.exponentialRampToValueAtTime(.0001,t0+dur); s.connect(f); f.connect(g); g.connect(master); s.start(t0); }
  const now=()=>{const c=ac(); return c?c.currentTime+.02:0};
  const lib={
    ding(){ const t=now(); [1318.5,1975.5,2637].forEach((f,i)=>tone(f,t,1.6,{vol:[.35,.18,.08][i]})); [1318.5,1975.5].forEach((f,i)=>tone(f,t+.16,1.4,{vol:[.25,.12][i]})); },
    strike(){ const t=now(); [98,103.8,146.8].forEach(f=>tone(f,t,.95,{type:'sawtooth',vol:.22,release:.95,filter:1400})); tone(49,t,.95,{type:'square',vol:.12,filter:600}); },
    buzz(){ const t=now(); tone(880,t,.12,{type:'square',vol:.18}); tone(1174.7,t+.12,.28,{type:'square',vol:.18}); },
    zero(){ const t=now(); tone(311,t,.35,{type:'triangle',vol:.3}); tone(233,t+.35,.6,{type:'triangle',vol:.3}); },
    win(){ const t=now(); [523.3,659.3,784,1046.5,1318.5].forEach((f,i)=>{tone(f,t+i*.09,.5,{type:'triangle',vol:.22}); tone(f*2,t+i*.09,.3,{vol:.06});}); [1046.5,1318.5,1568].forEach(f=>tone(f,t+.5,1.4,{type:'triangle',vol:.14})); for(let i=0;i<6;i++) noise(t+.5+i*.07,.25,.05,4000); },
    tick(){ const t=now(); tone(1600,t,.05,{type:'square',vol:.08}); },
    timeup(){ lib.strike(); },
    reveal(){ const t=now(); tone(660,t,.08,{type:'square',vol:.12}); tone(990,t+.07,.18,{type:'square',vol:.12}); },
    applause(){ const t=now(); for(let i=0;i<40;i++) noise(t+Math.random()*2.4,.05+Math.random()*.08,.05+Math.random()*.08,1200+Math.random()*2500); },
    theme(){ // original upbeat game-show jingle
      const t=now(), bpm=152, b=60/bpm;
      const mel=[ // [beat, midi, len]
        [0,72,.5],[.5,76,.5],[1,79,1],[2,81,.5],[2.5,79,.5],[3,76,1],
        [4,77,.5],[4.5,81,.5],[5,84,1],[6,83,.5],[6.5,81,.5],[7,79,1],
        [8,72,.5],[8.5,76,.5],[9,79,1],[10,84,.5],[10.5,83,.5],[11,81,.75],[11.75,79,.25],
        [12,77,.5],[12.5,79,.5],[13,81,.5],[13.5,83,.5],[14,84,2]];
      const bass=[[0,48],[1,55],[2,48],[3,55],[4,53],[5,60],[6,53],[7,55],[8,48],[9,55],[10,57],[11,53],[12,53],[13,55],[14,48]];
      const chords=[[0,[60,64,67]],[4,[60,65,69]],[8,[60,64,67]],[10,[57,60,65]],[12,[55,59,62]],[14,[60,64,67,72]]];
      const hz=m=>440*Math.pow(2,(m-69)/12);
      mel.forEach(([bt,m,l])=>{ tone(hz(m),t+bt*b,l*b*.95,{type:'sawtooth',vol:.11,filter:3200,release:l*b*.95}); tone(hz(m),t+bt*b,l*b*.95,{type:'square',vol:.05,detune:7,filter:2400,release:l*b*.95}); });
      bass.forEach(([bt,m])=>tone(hz(m),t+bt*b,b*.9,{type:'triangle',vol:.28,release:b*.9}));
      chords.forEach(([bt,ns],i)=>{ const len=(i<chords.length-1?chords[i+1][0]-bt:2)*b; ns.forEach(m=>tone(hz(m),t+bt*b,len,{type:'sawtooth',vol:.035,filter:1800,attack:.03,release:len})); });
      for(let i=0;i<16;i++){ noise(t+i*b,.06,.12,6000); if(i%2) noise(t+i*b,.16,.16,1200); tone(60,t+i*b,.12,{type:'sine',vol:i%2?0:.35,release:.12}); }
      [72,76,79,84].forEach(m=>tone(hz(m),t+14*b,2.2*b,{type:'triangle',vol:.1,release:2.2*b}));
    }
  };
  const custom={}, playing=new Set();
  function playCustom(n){ const url=custom[n]; if(!url) return false; const a=new Audio(url); playing.add(a); a.onended=()=>playing.delete(a); a.play().catch(()=>{}); return true; }
  function stopAll(){ playing.forEach(a=>{ try{a.pause()}catch(e){} }); playing.clear(); }
  return {unlock:ac, custom, stopAll, play:n=>{
    if(n==='stop'){ stopAll(); return; }
    if(playCustom(n)) return;
    if(n==='timeup' && playCustom('strike')) return;
    try{ lib[n]&&lib[n](); }catch(e){} }};
})();

const SOUND_SLOTS=[['theme','Theme song'],['ding','Correct answer'],['strike','Strike buzzer'],['buzz','Buzz-in'],['win','Points awarded'],['applause','Applause'],['zero','Fast Money zero / duplicate'],['timeup','Fast Money time up']];
const SoundStore=(()=>{
  let dbp=null, names={}; const bc=('BroadcastChannel' in window)?new BroadcastChannel('ff-sounds'):null; const api={onchange:null};
  function db(){ if(!dbp) dbp=new Promise((res,rej)=>{ try{ const r=indexedDB.open('ff-sounds',1); r.onupgradeneeded=()=>r.result.createObjectStore('s'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }catch(e){ rej(e); } }); return dbp; }
  async function load(){
    try{ const d=await db(); await new Promise(res=>{ const t=d.transaction('s','readonly'), st=t.objectStore('s'), rk=st.getAllKeys(), rv=st.getAll();
      t.oncomplete=()=>{ Object.keys(SFX.custom).forEach(k=>{ URL.revokeObjectURL(SFX.custom[k]); delete SFX.custom[k]; }); names={};
        rk.result.forEach((k,i)=>{ SFX.custom[k]=URL.createObjectURL(rv.result[i].blob); names[k]=rv.result[i].name; }); res(); };
      t.onerror=()=>res(); }); }catch(e){}
    if(api.onchange) api.onchange(); return names;
  }
  async function write(fn){ const d=await db(); await new Promise((res,rej)=>{ const t=d.transaction('s','readwrite'); fn(t.objectStore('s')); t.oncomplete=res; t.onerror=()=>rej(t.error); }); await load(); if(bc) bc.postMessage('reload'); }
  if(bc) bc.onmessage=()=>load();
  api.load=load; api.names=()=>names;
  api.set=(k,file)=>write(st=>st.put({blob:file,name:file.name},k));
  api.del=k=>write(st=>st.delete(k));
  return api;
})();
SoundStore.load();

  const nm=SoundStore.names();

function wireSoundPanel(container,rerender){
  container.addEventListener('change',e=>{ const t=e.target; if(t.dataset&&t.dataset.snd&&t.files&&t.files[0]) SoundStore.set(t.dataset.snd,t.files[0]).then(rerender); });
  container.addEventListener('click',e=>{ const t=e.target.closest('[data-sndtest],[data-sndreset]'); if(!t) return; e.stopPropagation();
    if(t.dataset.sndtest){ SFX.unlock(); SFX.stopAll(); SFX.play(t.dataset.sndtest); }
    if(t.dataset.sndreset) SoundStore.del(t.dataset.sndreset).then(rerender); });
}

function makeCode(){ const L='ABCDEFGHJKMNPQRSTUVWXYZ'; let s=''; for(let i=0;i<4;i++) s+=L[Math.floor(Math.random()*L.length)]; return s; }
function peerOpts(){ return {debug:0, config:{iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:global.stun.twilio.com:3478'}]}}; }

/* client connection with auto-reconnect */
function connectClient(code, hello, onMsg, onStatus){
  let peer=null, conn=null, dead=false, timer=null;
  function start(){
    onStatus('connecting');
    if(peer){ try{peer.destroy()}catch(e){} }
    peer=new Peer(undefined, peerOpts());
    peer.on('open',()=>{
      conn=peer.connect(PREFIX+code,{reliable:true});
      conn.on('open',()=>{ onStatus('connected'); conn.send(hello()); });
      conn.on('data',onMsg);
      conn.on('close',()=>{ onStatus('lost'); retry(); });
      conn.on('error',()=>{ onStatus('lost'); retry(); });
    });
    peer.on('error',e=>{ onStatus(e&&e.type==='peer-unavailable'?'nohost':'lost'); retry(); });
    peer.on('disconnected',()=>{ try{peer.reconnect()}catch(e){} });
  }
  function retry(){ if(dead||timer) return; timer=setTimeout(()=>{timer=null; start();},2500); }
  start();
  return { send:m=>{ if(conn&&conn.open) conn.send(m); }, reconnect:()=>{ if(!conn||!conn.open) start(); } };
}

    bz.addEventListener('touchstart',press,{passive:false}); bz.addEventListener('mousedown',press);

  function renderPlay(){

    $('#pS0').textContent=S.teams[0].name+' '+S.teams[0].score; $('#pS1').textContent=S.teams[1].name+' '+S.teams[1].score;

    $('#pQ').textContent = S.screen==='board'&&S.round&&!S.round.hideQ ? S.round.q : (S.screen==='fm'?'Fast Money!':'Get ready…');

    else if(B.open){ const already=(B.pressed||[]).includes(me.pid); bz.disabled=already; st.textContent=already?'Buzzed!':'Buzzers open!'; }
    else { bz.disabled=true; st.textContent='Buzzers locked'; }
  }
  function updConn(){ const c=$('#pConn'); if(c) c.textContent= status==='connected'?'● connected':status==='nohost'?'Waiting for host…':'Connecting…'; }
  net=connectClient(code,hello,msg=>{
    if(msg.t==='state'){ const first=!S; S=msg.s; if(first && !me.joined){} else if(me.joined && !$('#pBuzz')) playView(); else renderPlay();
      if(!me.joined && $('.teamPick')){ const bs=root.querySelectorAll('.teamPick button'); bs[0].textContent=S.teams[0].name; bs[1].textContent=S.teams[1].name; } }
    if(msg.t==='sfx' && msg.n==='buzzopen'){ try{navigator.vibrate&&navigator.vibrate(40)}catch(e){} }
  },st=>{ status=st; updConn(); });
  if(me.joined) playView(); else joinView();
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden) net.reconnect(); });
}

/* ================= HOST ================= */
function initHost(){
  const root=$('#host'); root.classList.remove('hidden');
  document.querySelector('.stage').style.display='none';
  const Q=DATA.questions, FMQ=(DATA.fastMoney||[]).slice(0,5); while(FMQ.length<5) FMQ.push('Fast Money question '+(FMQ.length+1));
  const blankFM=()=>[0,1].map(()=>[0,1,2,3,4].map(()=>({a:'',p:'',ra:false,rp:false})));
  let G=LS.get('ff-host',null);
  if(!G || !G.code){ G={code:makeCode(),teams:[{name:'Team 1',score:0},{name:'Team 2',score:0}],screen:'title',qi:0,revealed:[],unscored:[],bank:0,mult:1,strikes:0,strike:null,awarded:false,control:null,hideQ:false,showQR:true,
    buzz:{open:false,first:null,ts:0,pressed:[]},fm:{rows:blankFM(),hideP1:false,timer:{running:false,left:0}},hostSound:false}; }
  G.buzz=G.buzz||{open:false,first:null,ts:0,pressed:[]};
  if(G.fm&&G.fm.timer) G.fm.timer.running=false;
  const conns=new Map(); // peerId -> {conn, role, pid, name, team}
  let peer=null, idTries=0;
  function save(){ LS.set('ff-host',G); }
  function fmTotal(){ let t=0; G.fm.rows.forEach(r=>r.forEach(c=>{ if(c.rp) t+=(+c.p||0); })); return t; }
  function pub(){
    const q=Q[G.qi]||['',[]];
    return {title:DATA.title,code:G.code,screen:G.screen,teams:G.teams,control:G.control,showQR:G.showQR,strike:G.strike,
      buzz:{open:G.buzz.open,first:G.buzz.first,ts:G.buzz.ts,pressed:G.buzz.pressed},
      round:{qi:G.qi,total:Q.length,q:q[0],hideQ:G.hideQ,bank:G.bank,mult:G.mult,strikes:G.strikes,slots:q[1].slice(0,8).map((a,i)=>G.revealed[i]?{r:true,a:a[0],p:a[1],u:!!G.unscored[i]}:{r:false})},
      fm:{hideP1:G.fm.hideP1,total:fmTotal(),timer:G.fm.timer,rows:G.fm.rows.map(r=>r.map(c=>({ra:c.ra,rp:c.rp,a:c.ra?c.a:'',p:c.rp?(+c.p||0):''})))}};
  }
  function broadcast(){ save(); const m={t:'state',s:pub()}; conns.forEach(c=>{ if(c.conn.open) try{c.conn.send(m)}catch(e){} }); render(); }
  function sfx(n){ conns.forEach(c=>{ if(c.conn.open && c.role==='display') try{c.conn.send({t:'sfx',n})}catch(e){} }); if(G.hostSound) SFX.play(n); }
  function sfxAll(n){ conns.forEach(c=>{ if(c.conn.open) try{c.conn.send({t:'sfx',n})}catch(e){} }); }

  function startPeer(){
    if(peer){ try{peer.destroy()}catch(e){} }
    setNet('Starting…');
    peer=new Peer(PREFIX+G.code, peerOpts());
    peer.on('open',()=>{ idTries=0; setNet('● Live — players can join'); });
    peer.on('connection',conn=>{
      conn.on('open',()=>{ conns.set(conn.peer,{conn,role:'?'}); conn.send({t:'state',s:pub()}); render(); });
      conn.on('data',m=>onMsg(conn,m));
      conn.on('close',()=>{ conns.delete(conn.peer); render(); });
      conn.on('error',()=>{ conns.delete(conn.peer); render(); });
    });
    peer.on('disconnected',()=>{ setNet('Reconnecting…'); try{peer.reconnect()}catch(e){} });
    peer.on('error',e=>{
      if(e.type==='unavailable-id'){ idTries++; if(idTries<4){ setNet('Code busy, retrying…'); setTimeout(startPeer,3000); } else { G.code=makeCode(); idTries=0; save(); render(); startPeer(); } }
      else { setNet('Connection issue ('+e.type+'), retrying…'); setTimeout(()=>{ if(peer.destroyed||peer.disconnected) startPeer(); },3000); }
    });
  }
  function setNet(t){ const el=$('#hNet'); if(el) el.textContent=t; }
  function onMsg(conn,m){
    const c=conns.get(conn.peer)||{conn};
    if(m.t==='hello'){ c.role=m.role; c.pid=m.pid; c.name=m.name; c.team=m.team; conns.set(conn.peer,c); render(); }
    if(m.t==='buzz'){ doBuzz({pid:c.pid,name:c.name,team:c.team}); }
  }
  function doBuzz(b){
    if(!G.buzz.open || G.buzz.first || b.team==null) return;
    G.buzz.first=b; G.buzz.ts=Date.now(); G.buzz.open=false; G.control=b.team; sfx('buzz'); broadcast();
  }

  /* --- actions --- */
  const A={
    gotoQ(i){ G.qi=Math.max(0,Math.min(Q.length-1,i)); G.revealed=[]; G.unscored=[]; G.bank=0; G.strikes=0; G.awarded=false; G.control=null; G.buzz={open:false,first:null,ts:0,pressed:[]}; G.screen='board'; broadcast(); },
    reveal(i){ const a=Q[G.qi][1][i]; if(!a||G.revealed[i]) return; G.revealed[i]=true; if(!G.awarded){ G.bank+=a[1]*G.mult; } else G.unscored[i]=true; sfx('ding'); broadcast(); },
    hide(i){ const a=Q[G.qi][1][i]; if(!G.revealed[i]) return; G.revealed[i]=false; if(!G.unscored[i]) G.bank=Math.max(0,G.bank-a[1]*G.mult); G.unscored[i]=false; broadcast(); },
    revealRest(){ Q[G.qi][1].forEach((a,i)=>{ if(!G.revealed[i]){ G.revealed[i]=true; G.unscored[i]=true; } }); sfx('reveal'); broadcast(); },
    strike(){ G.strikes=Math.min(3,G.strikes+1); G.strike={n:G.strikes,ts:Date.now()}; sfx('strike'); broadcast(); },
    oneX(){ G.strike={n:1,ts:Date.now()}; sfx('strike'); broadcast(); },
    clearStrikes(){ G.strikes=0; broadcast(); },
    award(t){ if(G.bank<=0) return; G.teams[t].score+=G.bank; G.bank=0; G.awarded=true; G.control=t; sfx('win'); broadcast(); },
    mult(m){ const q=Q[G.qi][1]; let bank=0; G.mult=m; q.forEach((a,i)=>{ if(G.revealed[i]&&!G.unscored[i]) bank+=a[1]*m; }); if(!G.awarded) G.bank=bank; broadcast(); },
    openBuzz(){ G.buzz={open:true,first:null,ts:0,pressed:[]}; sfxAll('buzzopen'); broadcast(); },
    lockBuzz(){ G.buzz.open=false; broadcast(); },
    resetBuzz(){ G.buzz={open:false,first:null,ts:0,pressed:[]}; broadcast(); },
    control(t){ G.control=t; broadcast(); },
    score(t,d){ G.teams[t].score=Math.max(0,G.teams[t].score+d); broadcast(); },
    screen(s){ G.screen=s; broadcast(); },
    theme(){ sfx('theme'); },
    applause(){ sfx('applause'); },
    newGame(){ if(!askConfirm('newgame')) return; const code=G.code; G.teams.forEach(t=>t.score=0); G.fm={rows:blankFM(),hideP1:false,timer:{running:false,left:0}}; G.screen='title'; G.code=code; A.gotoQ(0); G.screen='title'; broadcast(); },
  };
  let confirmKey=null, confirmT=0;
  function askConfirm(k){ if(confirmKey===k && Date.now()-confirmT<4000){ confirmKey=null; return true; } confirmKey=k; confirmT=Date.now(); flash('Press again to confirm'); return false; }
  function flash(t){ const el=$('#hFlash'); if(!el) return; el.textContent=t; el.style.opacity=1; clearTimeout(flash.t); flash.t=setTimeout(()=>el.style.opacity=0,2500); }

  /* fast money timer */
  let fmInt=null;
  function fmStart(sec){ G.fm.timer={running:true,left:sec}; clearInterval(fmInt); let last=Date.now();
    fmInt=setInterval(()=>{ const n=Date.now(); G.fm.timer.left=Math.max(0,G.fm.timer.left-(n-last)/1000); last=n; if(G.fm.timer.left<=5 && G.fm.timer.left>0) sfx('tick'); if(G.fm.timer.left<=0){ G.fm.timer.running=false; clearInterval(fmInt); sfx('timeup'); } broadcast(); },1000); broadcast(); }
  function fmStop(){ clearInterval(fmInt); G.fm.timer.running=false; broadcast(); }

  /* keyboard buzz for in-room players without phones */
  document.addEventListener('keydown',e=>{
    if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT') return;
    const k=e.key.toLowerCase();
    if(k==='a') doBuzz({pid:'kbd-a',name:'',team:0});
    if(k==='l') doBuzz({pid:'kbd-l',name:'',team:1});

    const t=e.target;
    if(t.dataset.fa){ const [p,r]=t.dataset.fa.split(',').map(Number); G.fm.rows[p][r].a=t.value; save(); if(G.fm.rows[p][r].ra) broadcastQuiet(); }
    if(t.dataset.fp){ const [p,r]=t.dataset.fp.split(',').map(Number); G.fm.rows[p][r].p=t.value; save(); if(G.fm.rows[p][r].rp) broadcastQuiet(); }
  });
  function broadcastQuiet(){ save(); const m={t:'state',s:pub()}; conns.forEach(c=>{ if(c.conn.open) try{c.conn.send(m)}catch(e){} }); }
  // heartbeat so late/dropped clients stay in sync
  setInterval(()=>{ const m={t:'state',s:pub()}; conns.forEach(c=>{ if(c.conn.open) try{c.conn.send(m)}catch(e){} }); },4000);

  wireSoundPanel(root,()=>render()); SoundStore.onchange=()=>render();
  render(); startPeer();
}
})();
</script>
</body>
</html>
